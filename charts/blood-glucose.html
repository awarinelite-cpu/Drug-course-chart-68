<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Blood Glucose Chart</title>
<link rel="stylesheet" href="../js/styles.css">
<style>
  .sheet { background:#fff; max-width:950px; margin:20px auto; padding:30px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .sheet-title { text-align:center; font-size:18px; font-weight:bold; margin-bottom:16px; }
  .toggle-row { display:flex; gap:8px; margin-bottom:16px; justify-content:center; }
  .toggle-btn { padding:9px 20px; border:2px solid #2563eb; background:#fff; color:#2563eb; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; }
  .toggle-btn.active { background:#2563eb; color:#fff; }
  table.chart { width:100%; border-collapse:collapse; }
  table.chart th, table.chart td { border:1px solid #000; padding:6px 4px; font-size:12px; text-align:center; }
  table.chart th { background:#f2f2f2; text-transform:uppercase; }
  table.chart td input { width:100%; border:none; background:transparent; text-align:center; font-size:12px; font-family:inherit; }
  .table-wrap { overflow-x:auto; }
  .unit-note { text-align:center; font-size:11px; color:#666; margin-bottom:10px; }
  @media print {
    .no-print { display:none !important; }
    .sheet { box-shadow:none; margin:0; }
    body { background:#fff; }
  }
</style>
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<div class="topbar no-print">
  <div class="brand">Blood Glucose Chart</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('../index.html')">Back</button>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>

<div class="container no-print">
  <div class="patient-banner">
    <div><div class="pname" id="pb_name">Loading…</div><div class="pmeta" id="pb_meta"></div></div>
  </div>
  <div id="pb_allergy"></div>
  <div id="archiveBanner" style="display:none; background:#fef3c7; border:1px solid #f59e0b; color:#78350f; font-weight:bold; padding:8px 12px; border-radius:6px; margin-top:10px; font-size:13px;"></div>
  <div id="saveStatus" style="font-size:12px; color:#555; margin-top:8px; text-align:right;">—</div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-title" id="chartTitle">6 Points Glycemic Chart</div>
  <div class="unit-note">All glucose readings in mg/dL</div>
  <div class="unit-note" id="rangeNote">Normal: Fasting/Pre-meal 70–99 &nbsp;•&nbsp; 2hrs Post-meal &lt;140 &nbsp;•&nbsp; readings outside these ranges are flagged red</div>

  <div class="toggle-row no-print">
    <button class="toggle-btn" id="btn6" onclick="switchType('6point')">6-Point</button>
    <button class="toggle-btn" id="btn3" onclick="switchType('3point')">3-Point</button>
  </div>

  <div class="table-wrap">
  <table class="chart" id="chartTable">
    <thead id="chartHead"></thead>
    <tbody id="chartBody"></tbody>
  </table>
  </div>
  <div class="no-print" id="rowControls" style="margin-top:10px;">
    <button class="btn btn-success" onclick="addRow(1)">+ Add Row</button>
    <button class="btn btn-secondary" onclick="removeRow()">− Remove Row</button>
    <button class="btn btn-primary" id="saveBtn" onclick="manualSave()">Save</button>
  </div>
  <div id="saveStatusBottom" class="no-print" style="font-size:13px; color:#555; margin-top:10px; text-align:center; font-weight:bold;">—</div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth-guard.js";
  import { loadPatientHeader, getPatientIdFromUrl } from "../js/chart-common.js";
  import { lockBackTo } from "../js/back-guard.js";
  import { db } from "../js/firebase.js";
  import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const patientId = getPatientIdFromUrl();
  if (!patientId) window.location.href = '../index.html';
  lockBackTo('../index.html');

  // If ?admission=<id> is present we're viewing this chart as part of a closed-out
  // admission folder — read-only, no edit controls.
  const admissionId = new URLSearchParams(window.location.search).get('admission');
  const isArchived = !!admissionId;
  const STATUS_LABELS = { referred: 'Referred to another hospital', transferred: 'Transferred to another ward', discharged: 'Discharged' };

  const CHART_DEFS = {
    '6point': {
      title: '6 Points Glycemic Chart',
      columns: [
        { label: 'Date', type: 'date' },
        { label: 'Time', type: 'time' },
        { label: 'FBS', type: 'text', glucose: true, glucoseType: 'fasting' },
        { label: '2hrs Post Prandial', type: 'text', glucose: true, glucoseType: 'post' },
        { label: 'Pre-Lunch', type: 'text', glucose: true, glucoseType: 'fasting' },
        { label: '2hrs Post Lunch', type: 'text', glucose: true, glucoseType: 'post' },
        { label: 'Pre-Dinner', type: 'text', glucose: true, glucoseType: 'fasting' },
        { label: '2hrs Post Dinner', type: 'text', glucose: true, glucoseType: 'post' },
        { label: 'Remark', type: 'text' }
      ]
    },
    '3point': {
      title: '3 Points Glycemic Chart',
      columns: [
        { label: 'Date', type: 'date' },
        { label: 'Time', type: 'time' },
        { label: 'FBS', type: 'text', glucose: true, glucoseType: 'fasting' },
        { label: 'RBS', type: 'text', glucose: true, glucoseType: 'random' },
        { label: 'RBS', type: 'text', glucose: true, glucoseType: 'random' },
        { label: 'Remark', type: 'text' }
      ]
    }
  };

  // How many columns each chart type had BEFORE the Time column was added
  // (right after Date). A saved row this short predates that change — insert
  // a blank Time cell at index 1 so its existing values land back under the
  // same headers they were saved under, instead of shifting one column left.
  const PRE_TIME_COLUMN_COUNT = { '6point': 8, '3point': 5 };
  function migrateRow(type, row) {
    if (Array.isArray(row) && row.length === PRE_TIME_COLUMN_COUNT[type]) {
      return [row[0], '', ...row.slice(1)];
    }
    return row;
  }

  // 6-point glycemic chart normal ranges:
  //   Fasting / pre-meal (before breakfast, lunch, dinner): 70–99 mg/dL
  //   2 hrs post-prandial (after breakfast, lunch, dinner): under 140 mg/dL
  // Anything outside these ranges is flagged red. Random (3-point RBS) readings
  // fall back to a general hypo/hyperglycemia flag since no fixed target applies.
  function isAbnormalGlucose(v, glucoseType) {
    const n = parseFloat(v);
    if (isNaN(n)) return false;
    if (glucoseType === 'fasting') return n < 70 || n > 99;
    if (glucoseType === 'post') return n < 70 || n >= 140;
    return n < 70 || n > 180;
  }

  let chartRef;
  let saveTimer;
  let currentType = '6point';

  window.switchType = function (type, skipConfirm) {
    if (type === currentType) return;
    if (!skipConfirm && document.getElementById('chartBody').rows.length > 0) {
      if (!confirm('Switching chart type clears the current table (columns are different). Continue?')) return;
    }
    currentType = type;
    document.getElementById('btn6').classList.toggle('active', type === '6point');
    document.getElementById('btn3').classList.toggle('active', type === '3point');
    document.getElementById('chartTitle').textContent = CHART_DEFS[type].title;
    buildHead();
    document.getElementById('chartBody').innerHTML = '';
    addRow(10);
    scheduleSave();
  };

  function buildHead() {
    const thead = document.getElementById('chartHead');
    thead.innerHTML = '';
    const tr = document.createElement('tr');
    CHART_DEFS[currentType].columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col.label;
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  window.addRow = function (count, dataRow) {
    const tbody = document.getElementById('chartBody');
    const cols = CHART_DEFS[currentType].columns;
    for (let i = 0; i < count; i++) {
      const tr = document.createElement('tr');
      cols.forEach((col, c) => {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.type = col.type;
        if (dataRow && dataRow[c] !== undefined) input.value = dataRow[c];
        const refreshShading = () => td.classList.toggle('flag-abnormal', col.glucose && isAbnormalGlucose(input.value, col.glucoseType));
        if (isArchived) {
          input.readOnly = true;
        } else {
          input.addEventListener('input', () => { scheduleSave(); refreshShading(); });
        }
        refreshShading();
        td.appendChild(input);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
  };
  window.removeRow = function () {
    const tbody = document.getElementById('chartBody');
    if (tbody.rows.length > 0) { tbody.deleteRow(tbody.rows.length - 1); scheduleSave(); }
  };

  function setSaveStatus(text) {
    document.getElementById('saveStatus').textContent = text;
    const bottom = document.getElementById('saveStatusBottom');
    if (bottom) bottom.textContent = text;
  }

  function scheduleSave() {
    setSaveStatus('Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveChart, 600);
  }

  window.manualSave = function () {
    clearTimeout(saveTimer);
    setSaveStatus('Saving…');
    saveChart();
  };

  async function saveChart() {
    if (isArchived) return; // archived charts are read-only
    const rows = [];
    document.querySelectorAll('#chartBody tr').forEach(tr => {
      const cells = [];
      tr.querySelectorAll('input').forEach(inp => cells.push(inp.value));
      rows.push(cells);
    });
    try {
      await setDoc(chartRef, { chartType: currentType, rows, updatedAt: serverTimestamp() }, { merge: true });
      setSaveStatus('Saved ' + new Date().toLocaleTimeString());
    } catch (e) {
      setSaveStatus('Save failed: ' + (e.code || e.message));
    }
  }

  requireAuth(async (user, profile) => {
    const patient = await loadPatientHeader(patientId, { name: 'pb_name', meta: 'pb_meta', allergy: 'pb_allergy' });
    if (!patient) return;

    let data = null;
    let admissionMeta = null;
    if (isArchived) {
      const admSnap = await getDoc(doc(db, 'patients', patientId, 'admissions', admissionId));
      if (admSnap.exists()) {
        admissionMeta = admSnap.data();
        data = admissionMeta.bloodGlucose || null;
      }
    } else {
      chartRef = doc(db, 'patients', patientId, 'bloodGlucose', 'main');
      const snap = await getDoc(chartRef);
      if (snap.exists()) data = snap.data();
    }

    if (data) {
      currentType = data.chartType === '3point' ? '3point' : '6point';
      document.getElementById('btn6').classList.toggle('active', currentType === '6point');
      document.getElementById('btn3').classList.toggle('active', currentType === '3point');
      document.getElementById('chartTitle').textContent = CHART_DEFS[currentType].title;
      buildHead();
      const rows = (data.rows && data.rows.length) ? data.rows : [];
      if (rows.length) rows.forEach(r => addRow(1, migrateRow(currentType, r)));
      else if (!isArchived) addRow(10);
    } else {
      document.getElementById('btn6').classList.add('active');
      buildHead();
      if (!isArchived) addRow(10);
    }

    if (isArchived) {
      setSaveStatus('Viewing archived chart (read-only)');
      document.querySelector('.toggle-row').style.display = 'none';
      document.getElementById('rowControls').style.display = 'none';
      if (admissionMeta) {
        const when = admissionMeta.archivedAtDisplay || '';
        const banner = document.getElementById('archiveBanner');
        banner.textContent = 'Archived chart — ' + (admissionMeta.archiveReasonLabel || STATUS_LABELS[admissionMeta.archiveReason] || 'Closed') + (when ? ' on ' + when : '');
        banner.style.display = 'block';
      }
    } else {
      setSaveStatus('Changes save automatically — tap Save to confirm');
    }
  });
</script>
</body>
</html>
