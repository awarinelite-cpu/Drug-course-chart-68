<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drug Course Chart</title>
<link rel="stylesheet" href="../js/styles.css">
<style>
  .sheet { background:#fff; max-width:950px; margin:20px auto; padding:30px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .header h1 { font-family: Impact, "Arial Black", sans-serif; font-size:26px; text-align:center; text-transform:uppercase; margin:0 0 4px; }
  .header-sub { text-align:center; margin-bottom:16px; }
  .header-sub h2 { font-size:19px; text-decoration:underline; margin:0; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 30px; margin-bottom:14px; }
  .info-row { display:flex; align-items:baseline; font-size:14px; }
  .info-row label { font-weight:bold; margin-right:6px; white-space:nowrap; }
  .info-row input { flex:1; border:none; border-bottom:1px solid #000; padding:2px 4px; font-size:14px; background:transparent; }
  .info-row span.val { flex:1; border-bottom:1px solid #000; padding:2px 4px; font-size:14px; }

  .drugs-block { margin-bottom:18px; }
  .drugs-block h3 { font-size:15px; margin:0 0 8px; text-transform:uppercase; }
  table.drugs-table { width:100%; border-collapse:collapse; margin-bottom:8px; }
  table.drugs-table th, table.drugs-table td { border:1px solid #000; padding:5px 4px; font-size:12px; text-align:center; }
  table.drugs-table th { background:#f2f2f2; text-transform:uppercase; }
  table.drugs-table td input, table.drugs-table td select { width:100%; border:none; background:transparent; text-align:center; font-size:12px; font-family:inherit; }
  table.drugs-table td.no-col { width:34px; font-weight:bold; }
  table.drugs-table td.remove-col { width:34px; }
  .remove-drug-btn { background:#dc2626; color:#fff; border:none; border-radius:4px; padding:3px 7px; font-size:11px; cursor:pointer; }

  table.chart { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.chart th, table.chart td { border:1px solid #000; padding:5px 3px; font-size:12px; text-align:center; word-wrap:break-word; }
  table.chart th { background:#f2f2f2; text-transform:uppercase; }
  table.chart td input, table.chart td select { width:100%; border:none; background:transparent; text-align:center; font-size:12px; font-family:inherit; }
  table.chart td.view-cell { text-align:center; min-height:18px; }
  table.chart th.col-date, table.chart td.col-date { width:10%; }
  table.chart th.col-sno, table.chart td.col-sno { width:30%; text-align:left; }
  table.chart td.col-sno input { text-align:left; }
  table.chart th.col-time, table.chart td.col-time { width:9%; }
  table.chart th.col-dose, table.chart td.col-dose { width:10%; }
  table.chart th.col-route, table.chart td.col-route { width:11%; }
  table.chart th.col-nurse, table.chart td.col-nurse { width:16%; }
  table.chart th.col-remark, table.chart td.col-remark { width:14%; }
  table.chart td input[readonly] { background:#f8f8f8; color:#333; }
  .table-wrap { overflow-x:auto; }
  #verbalOrderBtn { padding:6px 12px; font-size:12px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
  .modal-box { background:#fff; border-radius:10px; width:100%; max-width:480px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #e5e7eb; }
  .modal-header h3 { margin:0; font-size:16px; }
  .modal-close { background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:#555; }
  .modal-body { padding:14px 16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px; }
  .verbal-bubble { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:8px 10px; }
  .verbal-meta { font-size:11px; color:#555; font-weight:bold; margin-bottom:3px; }
  .verbal-text { font-size:13px; white-space:pre-wrap; }
  .modal-footer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #e5e7eb; align-items:flex-end; }
  .modal-footer textarea { flex:1; resize:none; }
  @media print {
    .no-print { display:none !important; }
    .sheet { box-shadow:none; margin:0; }
    body { background:#fff; }
  }
</style>
</head>
<body>
<div class="topbar no-print">
  <div class="brand">Drug Course Chart</div>
  <div class="right">
    <a href="../index.html" class="btn btn-secondary" style="padding:6px 12px;">Back</a>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>

<div class="container no-print">
  <div class="patient-banner">
    <div><div class="pname" id="pb_name">Loading…</div><div class="pmeta" id="pb_meta"></div></div>
  </div>
  <div id="pb_allergy"></div>
  <div id="saveStatus" style="font-size:12px; color:#555; margin-top:8px; text-align:right;">—</div>
</div>

<div class="sheet" id="sheet">
  <div class="header"><h1>68 Nigerian Army Reference Hospital Yaba</h1></div>
  <div class="header-sub"><h2>Drugs Course Chart</h2></div>

  <div class="info-grid">
    <div class="info-row"><label>NAME:</label><span class="val" id="print_name"></span></div>
    <div class="info-row"><label>EMR:</label><span class="val" id="print_emr"></span></div>
    <div class="info-row"><label>WARD:</label><span class="val" id="print_ward"></span></div>
    <div class="info-row"><label>Hospital No:</label><span class="val" id="print_hospno"></span></div>
    <div class="info-row"><label>AGE:</label><span class="val" id="print_age"></span></div>
    <div class="info-row"><label>Date of Admission:</label><span class="val" id="print_admission"></span></div>
    <div class="info-row"><label>Diagnosis:</label><span class="val" id="print_diagnosis"></span></div>
    <div class="info-row"><label>Discharge Date:</label><input type="date" id="f_discharge"></div>
  </div>

  <div class="drugs-block">
    <h3>Drugs</h3>
    <table class="drugs-table" id="drugsTable">
      <thead>
        <tr><th style="width:34px;">No.</th><th>Drug Name</th><th>Route</th><th>Frequency</th><th>Action</th><th class="no-print" id="drugsRemoveHeadCol" style="width:34px;"></th></tr>
      </thead>
      <tbody id="drugsBody"></tbody>
    </table>
    <button class="btn btn-purple no-print" id="editDrugsBtn" style="padding:6px 12px; font-size:12px;" onclick="enterDrugsEditMode()">Edit</button>
    <button class="btn btn-success no-print" id="saveDrugsBtn" style="padding:6px 12px; font-size:12px; display:none;" onclick="exitDrugsEditMode()">Save</button>
    <button class="btn btn-success no-print" id="addDrugBtn" style="padding:6px 12px; font-size:12px; display:none;" onclick="addDrug()">+ Add Drug</button>
    <button class="btn btn-secondary no-print" id="verbalOrderBtn" onclick="openVerbalOrderModal()">+ Verbal Order</button>
  </div>

  <div class="table-wrap">
  <table class="chart" id="chartTable">
    <thead><tr>
      <th class="col-date">Date</th>
      <th class="col-sno">Drug S/N</th>
      <th class="col-time">Time</th>
      <th class="col-dose">Dose</th>
      <th class="col-route">Route</th>
      <th class="col-nurse">Nurses Name</th>
      <th class="col-remark">Remark</th>
    </tr></thead>
    <tbody id="chartBody"></tbody>
  </table>
  </div>
  <datalist id="drugSnoList"></datalist>
  <div class="no-print" style="margin-top:10px;">
    <button class="btn btn-purple" id="editChartBtn" onclick="enterChartEditMode()">Edit</button>
    <button class="btn btn-success" id="saveChartBtn" style="display:none;" onclick="exitChartEditMode()">Save</button>
    <button class="btn btn-success" id="addRowBtn" style="display:none;" onclick="addRow(1)">+ Add Row</button>
    <button class="btn btn-secondary" id="removeRowBtn" style="display:none;" onclick="removeRow()">− Remove Row</button>
  </div>
</div>

<div class="modal-overlay no-print" id="verbalModalOverlay" onclick="if(event.target===this) closeVerbalOrderModal();">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Verbal / Emergency Orders</h3>
      <button class="modal-close" onclick="closeVerbalOrderModal()">&times;</button>
    </div>
    <div class="modal-body" id="verbalOrderList"></div>
    <div class="modal-footer">
      <textarea id="verbalOrderInput" rows="2" placeholder="e.g. Dr. Adeyemi verbally ordered IV Furosemide 40mg STAT — not yet on the drug list"></textarea>
      <button class="btn btn-primary" onclick="submitVerbalOrder()">Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth-guard.js";
  import { loadPatientHeader, getPatientIdFromUrl } from "../js/chart-common.js";
  import { db } from "../js/firebase.js";
  import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const patientId = getPatientIdFromUrl();
  if (!patientId) window.location.href = '../index.html';

  const ROUTE_OPTIONS = ['', 'Oral', 'IV', 'IM', 'SC', 'Sublingual', 'Topical', 'Rectal', 'Inhalation', 'NG Tube', 'Other'];
  const FREQ_OPTIONS = ['', 'OD', 'BD', 'TDS', 'QDS', 'STAT', 'PRN', 'Q4H', 'Q6H', 'Q8H', 'Q12H', 'Weekly', 'Other'];
  const ACTION_OPTIONS = ['', 'Ongoing', 'Completed', 'Discontinued', 'Withheld', 'Other'];
  const fieldIds = ['f_discharge']; // only fields not sourced from the patient record

  let chartRef;
  let saveTimer;
  let drugs = []; // { name, route, frequency, action }
  let drugsEditMode = false;
  let chartRows = []; // { date, sno, time, dose, route, nurse, remark }
  let chartEditMode = false;
  let currentNurseName = '';
  let verbalOrders = []; // { text, nurse, at }

  function makeSelect(options, value) {
    const sel = document.createElement('select');
    options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt || '—';
      if (opt === value) o.selected = true;
      sel.appendChild(o);
    });
    return sel;
  }

  function renderDrugsTable() {
    if (drugsEditMode) renderDrugsTableEdit();
    else renderDrugsTableView();
  }

  function renderDrugsTableView() {
    const tbody = document.getElementById('drugsBody');
    tbody.innerHTML = '';
    document.getElementById('drugsRemoveHeadCol').style.display = 'none';
    drugs.forEach((d, i) => {
      const tr = document.createElement('tr');
      const cells = [i + 1, d.name || '—', d.route || '—', d.frequency || '—', d.action || '—'];
      cells.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function renderDrugsTableEdit() {
    document.getElementById('drugsRemoveHeadCol').style.display = '';
    const tbody = document.getElementById('drugsBody');
    tbody.innerHTML = '';
    drugs.forEach((d, i) => {
      const tr = document.createElement('tr');

      const tdNo = document.createElement('td');
      tdNo.textContent = i + 1;
      tr.appendChild(tdNo);

      const tdName = document.createElement('td');
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = d.name || '';
      nameInput.addEventListener('input', () => { drugs[i].name = nameInput.value; refreshDrugSnoList(); scheduleSave(); });
      tdName.appendChild(nameInput);
      tr.appendChild(tdName);

      const tdRoute = document.createElement('td');
      const routeSel = makeSelect(ROUTE_OPTIONS, d.route || '');
      routeSel.addEventListener('change', () => { drugs[i].route = routeSel.value; refreshDrugSnoList(); scheduleSave(); });
      tdRoute.appendChild(routeSel);
      tr.appendChild(tdRoute);

      const tdFreq = document.createElement('td');
      const freqSel = makeSelect(FREQ_OPTIONS, d.frequency || '');
      freqSel.addEventListener('change', () => { drugs[i].frequency = freqSel.value; scheduleSave(); });
      tdFreq.appendChild(freqSel);
      tr.appendChild(tdFreq);

      const tdAction = document.createElement('td');
      const actionSel = makeSelect(ACTION_OPTIONS, d.action || '');
      actionSel.addEventListener('change', () => { drugs[i].action = actionSel.value; scheduleSave(); });
      tdAction.appendChild(actionSel);
      tr.appendChild(tdAction);

      const tdRemove = document.createElement('td');
      tdRemove.className = 'no-print';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-drug-btn';
      removeBtn.textContent = 'x';
      removeBtn.onclick = () => {
        if (confirm('Remove this drug from the list?')) {
          drugs.splice(i, 1);
          renderDrugsTable();
          refreshDrugSnoList();
          scheduleSave();
        }
      };
      tdRemove.appendChild(removeBtn);
      tr.appendChild(tdRemove);

      tbody.appendChild(tr);
    });
  }

  window.enterDrugsEditMode = function () {
    drugsEditMode = true;
    document.getElementById('editDrugsBtn').style.display = 'none';
    document.getElementById('saveDrugsBtn').style.display = 'inline-block';
    document.getElementById('addDrugBtn').style.display = 'inline-block';
    renderDrugsTable();
  };

  window.exitDrugsEditMode = function () {
    drugsEditMode = false;
    document.getElementById('editDrugsBtn').style.display = 'inline-block';
    document.getElementById('saveDrugsBtn').style.display = 'none';
    document.getElementById('addDrugBtn').style.display = 'none';
    renderDrugsTable();
    scheduleSave();
  };

  window.addDrug = function () {
    drugs.push({ name: '', route: '', frequency: '', action: '' });
    renderDrugsTable();
    refreshDrugSnoList();
    scheduleSave();
  };

  function refreshDrugSnoList() {
    const list = document.getElementById('drugSnoList');
    list.innerHTML = '';
    drugs.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = (i + 1) + (d.name ? ' - ' + d.name : '');
      list.appendChild(o);
    });
  }

  // Fill in the nurse's name the first time any other field in a row is touched.
  function touchRowNurse(row) {
    if (!row.nurse && currentNurseName) row.nurse = currentNurseName;
  }

  function defaultRow() {
    return { date: '', sno: '', time: '', dose: 'AP', route: '', nurse: '', remark: '' };
  }

  // --- Verbal / emergency orders (conversation box) ---
  function renderVerbalOrderBtn() {
    const btn = document.getElementById('verbalOrderBtn');
    if (verbalOrders.length > 0) {
      btn.textContent = '💬 ' + verbalOrders.length;
      btn.className = 'btn btn-purple no-print';
    } else {
      btn.textContent = '+ Verbal Order';
      btn.className = 'btn btn-secondary no-print';
    }
  }

  function renderVerbalOrderList() {
    const box = document.getElementById('verbalOrderList');
    box.innerHTML = '';
    if (!verbalOrders.length) {
      box.innerHTML = '<p style="color:#777; font-size:13px; margin:0;">No verbal orders recorded yet.</p>';
      return;
    }
    verbalOrders.forEach(o => {
      const bubble = document.createElement('div');
      bubble.className = 'verbal-bubble';
      const meta = document.createElement('div');
      meta.className = 'verbal-meta';
      meta.textContent = (o.nurse || 'Unknown') + ' · ' + (o.at ? new Date(o.at).toLocaleString() : '');
      const text = document.createElement('div');
      text.className = 'verbal-text';
      text.textContent = o.text;
      bubble.appendChild(meta);
      bubble.appendChild(text);
      box.appendChild(bubble);
    });
    box.scrollTop = box.scrollHeight;
  }

  window.openVerbalOrderModal = function () {
    renderVerbalOrderList();
    document.getElementById('verbalModalOverlay').style.display = 'flex';
    document.getElementById('verbalOrderInput').focus();
  };

  window.closeVerbalOrderModal = function () {
    document.getElementById('verbalModalOverlay').style.display = 'none';
  };

  window.submitVerbalOrder = async function () {
    const input = document.getElementById('verbalOrderInput');
    const text = input.value.trim();
    if (!text) return;
    verbalOrders.push({ text, nurse: currentNurseName, at: new Date().toISOString() });
    input.value = '';
    renderVerbalOrderList();
    renderVerbalOrderBtn();
    // Emergency/verbal orders are important enough to save right away, not on the debounce.
    await saveChart();
  };

  function renderChartTable() {
    if (chartEditMode) renderChartEdit(); else renderChartView();
    document.getElementById('editChartBtn').style.display = chartEditMode ? 'none' : 'inline-block';
    document.getElementById('saveChartBtn').style.display = chartEditMode ? 'inline-block' : 'none';
    document.getElementById('addRowBtn').style.display = chartEditMode ? 'inline-block' : 'none';
    document.getElementById('removeRowBtn').style.display = chartEditMode ? 'inline-block' : 'none';
  }

  function renderChartView() {
    const tbody = document.getElementById('chartBody');
    tbody.innerHTML = '';
    chartRows.forEach(row => {
      const tr = document.createElement('tr');
      const cols = [
        ['col-date', row.date || ''],
        ['col-sno', row.sno || ''],
        ['col-time', row.time || ''],
        ['col-dose', row.dose || 'AP'],
        ['col-route', row.route || ''],
        ['col-nurse', row.nurse || ''],
        ['col-remark', row.remark || '']
      ];
      cols.forEach(([cls, val]) => {
        const td = document.createElement('td');
        td.className = cls + ' view-cell';
        td.textContent = val || '\u00A0';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function renderChartEdit() {
    const tbody = document.getElementById('chartBody');
    tbody.innerHTML = '';
    refreshDrugSnoList();
    chartRows.forEach((row, i) => {
      const tr = document.createElement('tr');

      // Date
      const tdDate = document.createElement('td');
      tdDate.className = 'col-date';
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = row.date || '';
      dateInput.addEventListener('input', () => { row.date = dateInput.value; touchRowNurse(row); scheduleSave(); nurseCell.value = row.nurse || ''; });
      tdDate.appendChild(dateInput);
      tr.appendChild(tdDate);

      // Drug S/N — the widest column, filled in manually by the nurse for the drug given at that time
      const tdSno = document.createElement('td');
      tdSno.className = 'col-sno';
      const snoInput = document.createElement('input');
      snoInput.type = 'text';
      snoInput.setAttribute('list', 'drugSnoList');
      snoInput.placeholder = 'e.g. 1 - Paracetamol';
      snoInput.value = row.sno || '';
      snoInput.addEventListener('input', () => { row.sno = snoInput.value; touchRowNurse(row); scheduleSave(); nurseCell.value = row.nurse || ''; });
      tdSno.appendChild(snoInput);
      tr.appendChild(tdSno);

      // Time
      const tdTime = document.createElement('td');
      tdTime.className = 'col-time';
      const timeInput = document.createElement('input');
      timeInput.type = 'time';
      timeInput.value = row.time || '';
      timeInput.addEventListener('input', () => { row.time = timeInput.value; touchRowNurse(row); scheduleSave(); nurseCell.value = row.nurse || ''; });
      tdTime.appendChild(timeInput);
      tr.appendChild(tdTime);

      // Dose
      const tdDose = document.createElement('td');
      tdDose.className = 'col-dose';
      const doseInput = document.createElement('input');
      doseInput.type = 'text';
      doseInput.value = row.dose || 'AP';
      doseInput.addEventListener('input', () => { row.dose = doseInput.value; touchRowNurse(row); scheduleSave(); nurseCell.value = row.nurse || ''; });
      tdDose.appendChild(doseInput);
      tr.appendChild(tdDose);

      // Route
      const tdRoute = document.createElement('td');
      tdRoute.className = 'col-route';
      const routeInput = document.createElement('input');
      routeInput.type = 'text';
      routeInput.value = row.route || '';
      routeInput.addEventListener('input', () => { row.route = routeInput.value; touchRowNurse(row); scheduleSave(); nurseCell.value = row.nurse || ''; });
      tdRoute.appendChild(routeInput);
      tr.appendChild(tdRoute);

      // Nurses Name — auto-filled with the logged-in nurse, read-only
      const tdNurse = document.createElement('td');
      tdNurse.className = 'col-nurse';
      const nurseCell = document.createElement('input');
      nurseCell.type = 'text';
      nurseCell.readOnly = true;
      nurseCell.value = row.nurse || '';
      tdNurse.appendChild(nurseCell);
      tr.appendChild(tdNurse);

      // Remark
      const tdRemark = document.createElement('td');
      tdRemark.className = 'col-remark';
      const remarkInput = document.createElement('input');
      remarkInput.type = 'text';
      remarkInput.value = row.remark || '';
      remarkInput.addEventListener('input', () => { row.remark = remarkInput.value; touchRowNurse(row); scheduleSave(); nurseCell.value = row.nurse || ''; });
      tdRemark.appendChild(remarkInput);
      tr.appendChild(tdRemark);

      tbody.appendChild(tr);
    });
  }

  window.enterChartEditMode = function () {
    chartEditMode = true;
    renderChartTable();
  };

  window.exitChartEditMode = function () {
    chartEditMode = false;
    renderChartTable();
    saveChart();
  };

  window.addRow = function (count) {
    for (let i = 0; i < count; i++) chartRows.push(defaultRow());
    renderChartTable();
    scheduleSave();
  };
  window.removeRow = function () {
    if (chartRows.length > 0) { chartRows.pop(); renderChartTable(); scheduleSave(); }
  };

  function scheduleSave() {
    document.getElementById('saveStatus').textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveChart, 600);
  }

  async function saveChart() {
    const data = {};
    fieldIds.forEach(id => data[id] = document.getElementById(id).value);
    data.rows = chartRows;
    data.drugs = drugs;
    data.verbalOrders = verbalOrders;
    data.updatedAt = serverTimestamp();
    try {
      await setDoc(chartRef, data, { merge: true });
      document.getElementById('saveStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById('saveStatus').textContent = 'Save failed: ' + (e.code || e.message);
    }
  }

  // Safety net: if a nurse forgets to press Save (or leaves the page open) while
  // editing, flush any pending changes to Firestore every 15s and whenever the
  // tab is hidden/closed, on top of the normal debounced auto-save above.
  setInterval(() => { if (chartEditMode || drugsEditMode) saveChart(); }, 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && (chartEditMode || drugsEditMode)) saveChart();
  });
  window.addEventListener('beforeunload', () => { if (chartEditMode || drugsEditMode) saveChart(); });

  requireAuth(async (user, profile) => {
    currentNurseName = (profile && profile.name) || user.email || 'Unknown';
    renderVerbalOrderBtn();

    const patient = await loadPatientHeader(patientId, { name: 'pb_name', meta: 'pb_meta', allergy: 'pb_allergy' });
    if (!patient) return;
    document.getElementById('print_name').textContent = patient.name || '';
    document.getElementById('print_emr').textContent = patient.emr || '';
    document.getElementById('print_diagnosis').textContent = patient.diagnosis || '';
    document.getElementById('print_ward').textContent = patient.ward || '';
    document.getElementById('print_hospno').textContent = patient.hospNo || '';
    document.getElementById('print_age').textContent = patient.age || '';
    document.getElementById('print_admission').textContent = patient.admission || '';

    chartRef = doc(db, 'patients', patientId, 'drugCourseChart', 'main');
    const snap = await getDoc(chartRef);
    if (snap.exists()) {
      const data = snap.data();
      fieldIds.forEach(id => { if (document.getElementById(id)) document.getElementById(id).value = data[id] || ''; });
      drugs = (data.drugs && data.drugs.length) ? data.drugs : Array(8).fill(null).map(() => ({ name: '', route: '', frequency: '', action: '' }));
      renderDrugsTable();
      chartRows = (data.rows && data.rows.length)
        ? data.rows.map(r => Array.isArray(r)
            ? { date: r[0] || '', sno: r[1] || '', time: r[2] || '', dose: r[3] || 'AP', route: r[4] || '', nurse: r[5] || '', remark: r[6] || '' } // migrate old array-row format
            : { ...r, dose: r.dose || 'AP' })
        : Array(18).fill(null).map(() => defaultRow());
      verbalOrders = data.verbalOrders || [];
    } else {
      drugs = Array(8).fill(null).map(() => ({ name: '', route: '', frequency: '', action: '' }));
      renderDrugsTable();
      chartRows = Array(18).fill(null).map(() => defaultRow());
      verbalOrders = [];
    }
    renderVerbalOrderBtn();
    renderChartTable();
    fieldIds.forEach(id => document.getElementById(id).addEventListener('input', scheduleSave));
    document.getElementById('saveStatus').textContent = 'Changes save automatically';
  });
</script>
</body>
</html>
