<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Seizure Chart</title>
<link rel="stylesheet" href="../js/styles.css">
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<div class="topbar no-print">
  <div class="brand">Seizure Chart</div>
  <div class="right">
    <button id="backLink" class="btn btn-secondary" style="padding:6px 12px;" onclick="window.location.href=this.dataset.fallback">Back</button>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>
<script>
  // Always send Back to this admission's Overview page (not wherever browser
  // history happens to point, e.g. straight back to the ward list when this
  // chart was opened directly from index.html rather than via Overview).
  (function () {
    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('patient');
    const admissionId = params.get('admission');
    const link = document.getElementById('backLink');
    link.dataset.fallback = patientId
      ? 'admission.html?patient=' + patientId + (admissionId ? '&admission=' + admissionId : '')
      : '../index.html';
  })();
</script>
<div class="container">
  <div class="patient-banner">
    <div><div class="pname" id="pb_name">Loading…</div><div class="pmeta" id="pb_meta"></div></div>
  </div>
  <div id="pb_allergy"></div>

  <div class="card-box no-print">
    <h3 style="margin-top:0;">New Entry</h3>
    <div id="entryForm" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
    <button class="btn btn-primary" id="addEntryBtn">Add Entry</button>
  </div>

  <div class="card-box">
    <h3 style="margin-top:0;">Entries</h3>
    <div class="table-wrap">
    <table class="entries">
      <thead id="entryHead"></thead>
      <tbody id="entryBody"></tbody>
    </table>
    </div>
  </div>
</div>

<script type="module">
  import { initEntryChart } from "../js/entry-chart.js?v=5";
  initEntryChart({
    collectionName: 'seizure',
    columns: [
      { key: 'time', label: 'Time', type: 'datetime-local' },
      { key: 'duration', label: 'Duration', type: 'text' },
      { key: 'type', label: 'Type', type: 'text' },
      { key: 'description', label: 'Description', type: 'text' }
    ]
  });
</script>
</body>
</html>
