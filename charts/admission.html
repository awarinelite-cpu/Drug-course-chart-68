<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Admission</title>
<link rel="stylesheet" href="../js/styles.css">
<style>
  .badge { display:inline-block; padding:3px 10px; border-radius:10px; color:#fff; font-size:11px; font-weight:bold; margin-left:8px; vertical-align:middle; }
  .badge-active { background:#2563eb; }
  .badge-referred { background:#7c3aed; }
  .badge-transferred { background:#d97706; }
  .badge-discharged { background:#16a34a; }
  @media print {
    .no-print { display:none !important; }
    body { background:#fff; }
  }
</style>
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<div class="topbar no-print">
  <div class="brand">Admission Overview</div>
  <div class="right">
    <button id="backLink" class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack(this.dataset.fallback)" data-fallback="overview.html">Back</button>
    <button id="shareBtn" class="btn btn-secondary" style="padding:6px 12px;" onclick="shareAdmission()">Share</button>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>
<div id="shareStatus" class="no-print" style="font-size:12px; color:#b91c1c; padding:4px 16px 0;"></div>

<div class="container">
  <div class="patient-banner">
    <div><div class="pname" id="pb_name">Loading…</div><div class="pmeta" id="pb_meta"></div></div>
  </div>
  <div id="pb_allergy"></div>

  <div class="card-box" style="margin-top:16px;">
    <div class="pname" id="adm_diagnosis" style="font-size:17px;">—<span class="badge" id="adm_badge"></span></div>
    <button class="badge no-print" id="readmitBtn" style="display:none; border:none; cursor:pointer; background:#2563eb; margin-top:6px;" onclick="readmitPatient()">↺ Readmit</button>
    <div class="pmeta" id="adm_meta" style="margin-top:4px;"></div>
    <div id="readmitStatus" class="no-print" style="font-size:12px; margin-top:6px;"></div>
  </div>

  <div class="chart-grid" id="chartGrid"></div>

  <div class="card-box no-print" style="margin-top:16px;">
    <h3 style="margin-top:0;">Export This Admission</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" style="padding:8px 14px;" id="exportPdfBtn">Export as PDF</button>
      <button class="btn btn-secondary" style="padding:8px 14px;" id="exportJsonBtn">Export as JSON</button>
    </div>
    <div id="exportStatus" style="font-size:12px; color:#555; margin-top:8px;"></div>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth-guard.js";
  import { loadPatientHeader, getPatientIdFromUrl } from "../js/chart-common.js";
  import { db } from "../js/firebase.js";
  import {
    doc, getDoc, setDoc, deleteDoc, addDoc, collection, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { buildExportRecord, downloadRecordAsPdf, downloadRecordAsJson, sharePdf } from "../js/export.js";

  const patientId = getPatientIdFromUrl();
  if (!patientId) window.location.href = '../index.html';

  const params = new URLSearchParams(window.location.search);
  const admissionId = params.get('admission');
  const isArchived = !!admissionId;

  document.getElementById('backLink').dataset.fallback = 'overview.html?patient=' + patientId;

  const STATUS_LABELS = { referred: 'Referred to another hospital', transferred: 'Transferred to another ward', discharged: 'Discharged' };
  const BADGE_CLASS = { referred: 'badge-referred', transferred: 'badge-transferred', discharged: 'badge-discharged' };

  const CHARTS = [
    { key: 'drug-course-chart', label: 'Drug Course Chart', icon: '💊' },
    { key: 'vitals', label: 'Vital Signs', icon: '❤️' },
    { key: 'blood-glucose', label: 'Glycemic Chart', icon: '🩸' },
    { key: 'intake-output', label: 'Intake & Output', icon: '💧' },
    { key: 'seizure', label: 'Seizure Chart', icon: '⚡' }
  ];

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function chartHref(key) {
    return key + '.html?patient=' + patientId + (isArchived ? '&admission=' + admissionId : '');
  }

  // Set while loading an archived, discharged admission — readmitPatient()
  // below restores this back onto the live charts.
  let archivedAdmissionData = null;
  let admissionRef = null;
  let currentProfileName = '';

  // Mirrors overview.html's own hasActiveData check — used here to make sure
  // readmitting doesn't silently overwrite a newer admission that's already
  // in progress on the live charts.
  async function hasActiveData() {
    const [drugSnap, bgSnap, vitalsSnap, ioSnap, seizureSnap] = await Promise.all([
      getDoc(doc(db, 'patients', patientId, 'drugCourseChart', 'main')),
      getDoc(doc(db, 'patients', patientId, 'bloodGlucose', 'main')),
      getDocs(collection(db, 'patients', patientId, 'vitals')),
      getDocs(collection(db, 'patients', patientId, 'intakeOutput')),
      getDocs(collection(db, 'patients', patientId, 'seizure'))
    ]);
    const drugData = drugSnap.exists() ? drugSnap.data() : null;
    const bgData = bgSnap.exists() ? bgSnap.data() : null;
    const hasDrugData = !!(drugData && ((drugData.f_diagnosis || '') || (drugData.drugs || []).some(d => d && d.name) || (drugData.rows || []).some(r => r && (r.date || r.sno))));
    const hasCells = arr => (arr || []).some(r => (r.cells || r || []).some(cell => cell));
    const hasBgData = !!(bgData && (hasCells(bgData.rows6) || hasCells(bgData.rows3) || hasCells(bgData.rows)));
    return hasDrugData || hasBgData || !vitalsSnap.empty || !ioSnap.empty || !seizureSnap.empty;
  }

  window.readmitPatient = async function () {
    const btn = document.getElementById('readmitBtn');
    const status = document.getElementById('readmitStatus');
    const patientName = document.getElementById('pb_name').textContent.trim() || 'this patient';
    if (!confirm('Readmit ' + patientName + '?\n\nThis cancels the discharge and restores the drug chart, vitals, glycemic chart, intake & output, and seizure chart from this admission back to active. Care continues from exactly where it left off.')) return;

    // Same reasoning as applyStatusAction's guard on the drug chart page:
    // this restores multiple collections from the archived record and then
    // deletes the archive doc, all in a specific order that depends on each
    // step actually completing — not something to risk running against a
    // stale offline cache.
    if (!navigator.onLine) {
      status.style.color = '#b91c1c';
      status.textContent = 'This needs an internet connection \u2014 readmitting restores several charts from the archived record and then removes it, and doing that safely requires reading the real data. Please try again once online.';
      return;
    }

    btn.disabled = true;
    status.style.color = '#555';
    status.textContent = 'Checking for a newer admission already in progress\u2026';

    try {
      if (await hasActiveData()) {
        status.style.color = '#b91c1c';
        status.textContent = 'This patient already has an active admission in progress — readmitting this record would overwrite it. Close out or resolve the current admission first, or contact an admin.';
        btn.disabled = false;
        return;
      }

      status.textContent = 'Restoring charts\u2026';
      const admData = archivedAdmissionData || {};
      const dc = admData.drugCourseChart || {};
      const restoredAuditLog = Array.isArray(dc.auditLog) ? dc.auditLog.slice() : [];
      restoredAuditLog.push({
        action: 'Patient readmitted — discharge on ' + (admData.archivedAtDisplay || 'an earlier date') + ' cancelled; care continues.',
        by: currentProfileName || 'Unknown',
        at: new Date().toISOString()
      });
      const restoredDrugChart = {
        ...dc,
        f_discharge: '', // no longer discharged
        auditLog: restoredAuditLog,
        updatedAt: serverTimestamp()
      };
      const bg = admData.bloodGlucose || { chartType: '6point', rows6: [], rows3: [] };
      const ioSummary = admData.intakeOutputSummary || { intake: 0, output: 0, balance: 0, periodDate: new Date().toISOString().slice(0, 10) };

      await Promise.all([
        setDoc(doc(db, 'patients', patientId, 'drugCourseChart', 'main'), restoredDrugChart),
        setDoc(doc(db, 'patients', patientId, 'bloodGlucose', 'main'), {
          chartType: bg.chartType || '6point',
          // A record archived before this fix may still only have the old
          // single 'rows' field — carry it into whichever type it belonged to
          // instead of dropping it.
          rows6: bg.rows6 || (bg.chartType !== '3point' ? (bg.rows || []) : []),
          rows3: bg.rows3 || (bg.chartType === '3point' ? (bg.rows || []) : []),
          updatedAt: serverTimestamp()
        }),
        setDoc(doc(db, 'patients', patientId, 'intakeOutputSummary', 'current'), { ...ioSummary, updatedAt: serverTimestamp() }),
        ...(admData.vitals || []).map(entry => addDoc(collection(db, 'patients', patientId, 'vitals'), entry)),
        ...(admData.intakeOutput || []).map(entry => addDoc(collection(db, 'patients', patientId, 'intakeOutput'), entry)),
        ...(admData.seizure || []).map(entry => addDoc(collection(db, 'patients', patientId, 'seizure'), entry))
      ]);

      // The discharge is cancelled, not just superseded — remove the
      // archived record so it doesn't keep showing as a closed admission
      // alongside the now-active one it was restored into.
      await deleteDoc(admissionRef);

      status.style.color = '#16a34a';
      status.textContent = 'Readmitted \u2014 redirecting to the active chart\u2026';
      setTimeout(() => window.location.href = 'drug-course-chart.html?patient=' + patientId, 900);
    } catch (e) {
      status.style.color = '#b91c1c';
      status.textContent = 'Readmit failed: ' + (e.code || e.message || 'unknown error');
      btn.disabled = false;
    }
  };

  window.shareAdmission = async function () {
    const btn = document.getElementById('shareBtn');
    const status = document.getElementById('shareStatus');
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparing…'; status.style.color = '#555'; status.textContent = '';
    try {
      const record = await buildExportRecord(patientId, { admissionId: isArchived ? admissionId : null });
      const diagnosis = document.getElementById('adm_diagnosis').textContent.trim();
      const patientName = document.getElementById('pb_name').textContent.trim();
      const result = await sharePdf(record, isArchived ? 'admission' : 'active_admission', diagnosis + ' — ' + patientName);
      if (result.downloaded) {
        status.style.color = '#555';
        status.textContent = 'Your browser can\u2019t share files directly, so the PDF was downloaded instead \u2014 you can share it from there.';
      } else if (result.shared) {
        status.textContent = '';
      }
    } catch (e) {
      status.style.color = '#b91c1c';
      status.textContent = 'Could not prepare the PDF to share: ' + (e.message || e.code || 'unknown error');
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  };

  requireAuth(async (user, profile) => {
    currentProfileName = (profile && profile.name) || user.email || 'Unknown';
    const patient = await loadPatientHeader(patientId, { name: 'pb_name', meta: 'pb_meta', allergy: 'pb_allergy' });
    if (!patient) return;

    let diagnosis = 'No diagnosis recorded';
    let metaLabel = '';
    let badgeText = '';
    let badgeClass = 'badge-active';

    if (isArchived) {
      admissionRef = doc(db, 'patients', patientId, 'admissions', admissionId);
      const snap = await getDoc(admissionRef);
      if (!snap.exists()) {
        alert('Admission record not found.');
        window.location.href = 'overview.html?patient=' + patientId;
        return;
      }
      const data = snap.data();
      archivedAdmissionData = data;
      diagnosis = data.diagnosis || diagnosis;
      metaLabel = data.archivedAtDisplay ? 'Closed on ' + data.archivedAtDisplay : '';
      badgeText = data.archiveReasonLabel || STATUS_LABELS[data.archiveReason] || 'Closed';
      badgeClass = BADGE_CLASS[data.archiveReason] || 'badge-discharged';
      if (data.archiveReason === 'discharged') {
        document.getElementById('readmitBtn').style.display = 'inline-block';
      }
    } else {
      const drugSnap = await getDoc(doc(db, 'patients', patientId, 'drugCourseChart', 'main'));
      diagnosis = (drugSnap.exists() && drugSnap.data().f_diagnosis) || 'No diagnosis entered yet';
      metaLabel = 'Currently active';
      badgeText = 'Active';
      badgeClass = 'badge-active';
    }

    document.getElementById('adm_diagnosis').innerHTML = escapeHtml(diagnosis) + '<span class="badge ' + badgeClass + '" id="adm_badge">' + escapeHtml(badgeText) + '</span>';
    document.getElementById('adm_meta').textContent = metaLabel;

    const grid = document.getElementById('chartGrid');
    grid.innerHTML = '';
    CHARTS.forEach(c => {
      const div = document.createElement('div');
      div.className = 'chart-card';
      div.innerHTML = '<span class="icon">' + c.icon + '</span>' + escapeHtml(c.label);
      div.onclick = () => { window.location.href = chartHref(c.key); };
      grid.appendChild(div);
    });

    const exportStatus = document.getElementById('exportStatus');
    async function runExport(kind) {
      const pdfBtn = document.getElementById('exportPdfBtn');
      const jsonBtn = document.getElementById('exportJsonBtn');
      pdfBtn.disabled = true; jsonBtn.disabled = true;
      exportStatus.textContent = 'Gathering this admission\u2019s record\u2026';
      try {
        const record = await buildExportRecord(patientId, { admissionId: isArchived ? admissionId : null, exportedBy: profile.name });
        if (kind === 'pdf') {
          exportStatus.textContent = 'Building PDF\u2026';
          await downloadRecordAsPdf(record, isArchived ? 'admission' : 'active_admission');
        } else {
          downloadRecordAsJson(record, isArchived ? 'admission' : 'active_admission');
        }
        exportStatus.textContent = 'Export complete.';
      } catch (e) {
        exportStatus.textContent = 'Export failed: ' + (e.message || e.code || 'unknown error');
      } finally {
        pdfBtn.disabled = false; jsonBtn.disabled = false;
      }
    }
    document.getElementById('exportPdfBtn').addEventListener('click', () => runExport('pdf'));
    document.getElementById('exportJsonBtn').addEventListener('click', () => runExport('json'));
  });
</script>
</body>
</html>
