<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Intake &amp; Output</title>
<link rel="stylesheet" href="../js/styles.css">
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<div class="topbar no-print">
  <div class="brand">Intake &amp; Output Chart</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('../index.html')">Back</button>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>
<div class="container">
  <div class="patient-banner">
    <div><div class="pname" id="pb_name">Loading…</div><div class="pmeta" id="pb_meta"></div></div>
  </div>
  <div id="pb_allergy"></div>

  <div class="card-box no-print">
    <h3 style="margin-top:0;">New Entry</h3>
    <div id="entryForm" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
    <button class="btn btn-primary" id="addEntryBtn">Add Entry</button>
  </div>

  <div class="card-box">
    <h3 style="margin-top:0;">Entries</h3>
    <div class="table-wrap">
    <table class="entries">
      <thead id="entryHead"></thead>
      <tbody id="entryBody"></tbody>
    </table>
    </div>
  </div>
</div>

<script type="module">
  import { initEntryChart } from "../js/entry-chart.js";

  function num(v) { return parseFloat(v) || 0; }
  function dayKeyOf(row) { return row.date || ''; }

  // Each row's own Total Intake / Total Output / Balance (mirrors the paper
  // I&O chart, where the Balance column is the net for that reading, not a
  // running total). The 24-Hour Total row at the bottom of the paper chart
  // is represented here by the summary card above the table.
  function deriveIORow(row) {
    const intake = num(row.oral) + num(row.iv) + num(row.ngPeg) + num(row.other);
    const output = num(row.urine) + num(row.vomit) + num(row.ngDrainage) + num(row.drainOther);
    return { ...row, totalIntake: intake, totalOutput: output, balance: intake - output };
  }
  function deriveIOBalance(ascRows) { return ascRows.map(deriveIORow); }

  // Totals for the current 24-hour period (today), used by the summary card
  // and the auto-saved 24-hour summary document.
  function computeTodayTotals(rawRows) {
    const today = new Date().toISOString().slice(0, 10);
    let intake = 0, output = 0;
    rawRows.forEach(row => {
      if (dayKeyOf(row) === today) {
        intake += num(row.oral) + num(row.iv) + num(row.ngPeg) + num(row.other);
        output += num(row.urine) + num(row.vomit) + num(row.ngDrainage) + num(row.drainOther);
      }
    });
    return { intake, output, balance: intake - output };
  }

  initEntryChart({
    collectionName: 'intakeOutput',
    orderField: 'time',
    sortKeyFrom: ['date', 'clockTime'],
    columns: [
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'clockTime', label: 'Time', type: 'time' },
      { key: 'oral', label: 'ORAL (mL)', type: 'text' },
      { key: 'iv', label: 'IV (mL)', type: 'text' },
      { key: 'ngPeg', label: 'NG/PEG (mL)', type: 'text' },
      { key: 'other', label: 'OTHER (mL)', type: 'text' },
      { key: 'totalIntake', label: 'TOTAL INTAKE (mL)', computed: true },
      { key: 'urine', label: 'URINE (mL)', type: 'text' },
      { key: 'vomit', label: 'VOMIT (mL)', type: 'text' },
      { key: 'ngDrainage', label: 'NG DRAINAGE (mL)', type: 'text' },
      { key: 'drainOther', label: 'DRAIN/OTHER (mL)', type: 'text' },
      { key: 'totalOutput', label: 'TOTAL OUTPUT (mL)', computed: true },
      { key: 'balance', label: 'BALANCE (mL)', computed: true, abnormal: v => parseFloat(v) < 0, deficitShade: true }
    ],
    deriveRows: deriveIOBalance,
    summary: {
      label: '24-Hour Total (Today)',
      archivedLabel: 'Balance at Close (Last 24-Hour Period)',
      storeAt: ['intakeOutputSummary', 'current'],
      archivedKey: 'intakeOutputSummary',
      compute: computeTodayTotals
    }
  });
</script>
</body>
</html>
