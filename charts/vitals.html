<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Vital Signs</title>
<link rel="stylesheet" href="../js/styles.css">
</head>
<body>
<div class="topbar no-print">
  <div class="brand">Vital Signs Chart</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('../index.html')">Back</button>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>
<div class="container">
  <div class="patient-banner">
    <div><div class="pname" id="pb_name">Loading…</div><div class="pmeta" id="pb_meta"></div></div>
  </div>
  <div id="pb_allergy"></div>

  <div class="card-box no-print">
    <h3 style="margin-top:0;">New Reading</h3>
    <div id="entryForm" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
    <button class="btn btn-primary" id="addEntryBtn">Add Reading</button>
  </div>

  <div class="card-box">
    <h3 style="margin-top:0;">Readings</h3>
    <table class="entries">
      <thead id="entryHead"></thead>
      <tbody id="entryBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initEntryChart } from "../js/entry-chart.js";

  // Normal-range checks — cells outside these are shaded red on the readings table.
  const isAbnormalTemp = v => { const n = parseFloat(v); return !isNaN(n) && (n < 36.1 || n > 37.5); };
  const isAbnormalPulse = v => { const n = parseFloat(v); return !isNaN(n) && (n < 60 || n > 100); };
  const isAbnormalResp = v => { const n = parseFloat(v); return !isNaN(n) && (n < 12 || n > 20); };
  const isAbnormalSpo2 = v => { const n = parseFloat(v); return !isNaN(n) && n < 95; };
  const isAbnormalBP = v => {
    const m = String(v).match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/);
    if (!m) return false;
    const sys = parseInt(m[1], 10), dia = parseInt(m[2], 10);
    return sys < 90 || sys > 140 || dia < 60 || dia > 90;
  };

  initEntryChart({
    collectionName: 'vitals',
    columns: [
      { key: 'time', label: 'Time', type: 'datetime-local' },
      { key: 'temp', label: 'Temp (°C)', type: 'text', abnormal: isAbnormalTemp },
      { key: 'pulse', label: 'Pulse', type: 'text', abnormal: isAbnormalPulse },
      { key: 'resp', label: 'Resp Rate', type: 'text', abnormal: isAbnormalResp },
      { key: 'bp', label: 'BP', type: 'text', abnormal: isAbnormalBP },
      { key: 'spo2', label: 'SpO2 (%)', type: 'text', abnormal: isAbnormalSpo2 },
      { key: 'notes', label: 'Notes', type: 'text' }
    ]
  });
</script>
</body>
</html>
