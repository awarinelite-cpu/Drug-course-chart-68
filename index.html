<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward Charts · Home</title>
<link rel="stylesheet" href="js/styles.css">
</head>
<body>
<div class="topbar">
  <div class="brand">68 NARHY Ward Charts</div>
  <div class="right">
    <span id="whoami"></span>
    <a id="adminLink" href="admin.html" class="btn btn-purple" style="display:none; padding:6px 12px;">Admin</a>
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="logout()">Log Out</button>
  </div>
</div>

<div class="container">
  <div class="card-box">
    <label>Search Patient (EMR number or name)</label>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="e.g. EMR12345 or John Doe" onkeydown="if(event.key==='Enter') doSearch();">
      <button class="btn btn-primary" onclick="doSearch()">Search</button>
      <button class="btn btn-success" onclick="showNewPatientForm()">+ New Patient</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="card-box" id="newPatientBox" style="display:none;">
    <h3 style="margin-top:0;">Register New Patient</h3>
    <div class="field"><label>Name</label><input type="text" id="np_name"></div>
    <div class="field"><label>EMR Number</label><input type="text" id="np_emr"></div>
    <div class="field"><label>Diagnosis</label><input type="text" id="np_diagnosis"></div>
    <div class="field"><label>Ward</label><input type="text" id="np_ward"></div>
    <div class="field"><label>Age</label><input type="text" id="np_age"></div>
    <div class="field"><label>Hospital No</label><input type="text" id="np_hospno"></div>
    <div class="field"><label>Date of Admission</label><input type="date" id="np_admission"></div>
    <div class="field"><label>Allergies</label><input type="text" id="np_allergies" placeholder="None known / list allergies"></div>
    <button class="btn btn-primary" onclick="createPatient()">Save Patient</button>
    <button class="btn btn-secondary" onclick="hideNewPatientForm()">Cancel</button>
    <div id="npMsg"></div>
  </div>

  <div class="card-box" id="patientBox" style="display:none;">
    <div class="patient-banner">
      <div>
        <div class="pname" id="pb_name"></div>
        <div class="pmeta" id="pb_meta" style="display:inline;"></div>
        <button class="btn btn-secondary edit-patient-btn" id="editPatientBtn" title="Edit patient information" onclick="openEditPatient()">✎</button>
      </div>
      <button class="btn btn-secondary" style="padding:6px 12px;" onclick="clearPatient()">Change Patient</button>
    </div>
    <div id="pb_allergy"></div>

    <div class="card-box" id="editPatientBox" style="display:none; margin-top:12px; box-shadow:none; border:1px solid #e5e7eb;">
      <h3 style="margin-top:0;">Edit Patient Information</h3>
      <div class="field"><label>Name</label><input type="text" id="ep_name"></div>
      <div class="field"><label>EMR Number</label><input type="text" id="ep_emr"></div>
      <div class="field"><label>Diagnosis</label><input type="text" id="ep_diagnosis"></div>
      <div class="field"><label>Ward</label><input type="text" id="ep_ward"></div>
      <div class="field"><label>Age</label><input type="text" id="ep_age"></div>
      <div class="field"><label>Hospital No</label><input type="text" id="ep_hospno"></div>
      <div class="field"><label>Date of Admission</label><input type="date" id="ep_admission"></div>
      <div class="field"><label>Allergies</label><input type="text" id="ep_allergies" placeholder="None known / list allergies"></div>
      <button class="btn btn-primary" onclick="saveEditPatient()">Save Changes</button>
      <button class="btn btn-secondary" onclick="closeEditPatient()">Cancel</button>
      <div id="epMsg"></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card" onclick="openChart('drug-course-chart')"><span class="icon">💊</span>Drug Course Chart</div>
      <div class="chart-card" onclick="openChart('vitals')"><span class="icon">❤️</span>Vital Signs</div>
      <div class="chart-card" onclick="openChart('intake-output')"><span class="icon">💧</span>Intake &amp; Output</div>
      <div class="chart-card" onclick="openChart('blood-glucose')"><span class="icon">🩸</span>Blood Glucose</div>
      <div class="chart-card" onclick="openChart('seizure')"><span class="icon">⚡</span>Seizure Chart</div>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, logout } from "./js/auth-guard.js";
  import { db } from "./js/firebase.js";
  import { collection, getDocs, addDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  window.logout = logout;
  let selectedPatient = null;
  let allPatientsCache = null;

  requireAuth((user, profile) => {
    document.getElementById('whoami').textContent = profile.name + ' (' + profile.role + ')';
    if (profile.role === 'admin') document.getElementById('adminLink').style.display = 'inline-block';
  });

  async function loadAllPatients(force) {
    if (allPatientsCache && !force) return allPatientsCache;
    const snap = await getDocs(collection(db, 'patients'));
    allPatientsCache = [];
    snap.forEach(d => allPatientsCache.push({ id: d.id, ...d.data() }));
    return allPatientsCache;
  }

  window.doSearch = async function () {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if (!q) { results.innerHTML = ''; return; }
    results.innerHTML = 'Searching…';
    const patients = await loadAllPatients();
    const matches = patients.filter(p =>
      (p.emr || '').toLowerCase().includes(q) || (p.name || '').toLowerCase().includes(q)
    );
    if (matches.length === 0) {
      results.innerHTML = '<div class="error-msg">No patient found. Use "+ New Patient" to register them.</div>';
      return;
    }
    results.innerHTML = '';
    matches.forEach(p => {
      const div = document.createElement('div');
      div.className = 'search-result-item';
      div.innerHTML = '<span><b>' + escapeHtml(p.name || 'Unnamed') + '</b> — EMR: ' + escapeHtml(p.emr || 'N/A') + '</span><span>' + escapeHtml(p.diagnosis || '') + '</span>';
      div.onclick = () => selectPatient(p);
      results.appendChild(div);
    });
  };

  function selectPatient(p) {
    selectedPatient = p;
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('newPatientBox').style.display = 'none';
    document.getElementById('pb_name').textContent = p.name || 'Unnamed';
    document.getElementById('pb_meta').textContent = 'EMR: ' + (p.emr || 'N/A') + '   |   Diagnosis: ' + (p.diagnosis || 'Not specified');
    const allergyBox = document.getElementById('pb_allergy');
    const allergyVal = (p.allergies || '').trim();
    if (allergyVal && !/^(none|nil|none known)$/i.test(allergyVal)) {
      allergyBox.innerHTML = '<div class="allergy-alert">ALLERGY ALERT: ' + escapeHtml(allergyVal) + '</div>';
    } else {
      allergyBox.innerHTML = '';
    }
    closeEditPatient();
    document.getElementById('patientBox').style.display = 'block';
  }

  window.clearPatient = function () {
    selectedPatient = null;
    closeEditPatient();
    document.getElementById('patientBox').style.display = 'none';
  };

  window.openEditPatient = function () {
    if (!selectedPatient) return;
    const p = selectedPatient;
    document.getElementById('ep_name').value = p.name || '';
    document.getElementById('ep_emr').value = p.emr || '';
    document.getElementById('ep_diagnosis').value = p.diagnosis || '';
    document.getElementById('ep_ward').value = p.ward || '';
    document.getElementById('ep_age').value = p.age || '';
    document.getElementById('ep_hospno').value = p.hospNo || '';
    document.getElementById('ep_admission').value = p.admissionDate || '';
    document.getElementById('ep_allergies').value = p.allergies || '';
    document.getElementById('epMsg').innerHTML = '';
    document.getElementById('editPatientBox').style.display = 'block';
  };

  window.closeEditPatient = function () {
    document.getElementById('editPatientBox').style.display = 'none';
  };

  window.saveEditPatient = async function () {
    if (!selectedPatient) return;
    const name = document.getElementById('ep_name').value.trim();
    const emr = document.getElementById('ep_emr').value.trim();
    const msgBox = document.getElementById('epMsg');
    msgBox.innerHTML = '';
    if (!name || !emr) {
      msgBox.innerHTML = '<div class="error-msg">Name and EMR number are required.</div>';
      return;
    }
    const updates = {
      name, emr,
      diagnosis: document.getElementById('ep_diagnosis').value.trim(),
      ward: document.getElementById('ep_ward').value.trim(),
      age: document.getElementById('ep_age').value.trim(),
      hospNo: document.getElementById('ep_hospno').value.trim(),
      admissionDate: document.getElementById('ep_admission').value.trim(),
      allergies: document.getElementById('ep_allergies').value.trim(),
      updatedAt: serverTimestamp()
    };
    try {
      await updateDoc(doc(db, 'patients', selectedPatient.id), updates);
    } catch (e) {
      msgBox.innerHTML = '<div class="error-msg">Save failed: ' + (e.code || e.message || 'unknown error') + '</div>';
      return;
    }
    const updatedPatient = { ...selectedPatient, ...updates };
    delete updatedPatient.updatedAt;
    await loadAllPatients(true);
    selectPatient(updatedPatient);
  };

  window.showNewPatientForm = function () { document.getElementById('newPatientBox').style.display = 'block'; };
  window.hideNewPatientForm = function () { document.getElementById('newPatientBox').style.display = 'none'; };

  window.createPatient = async function () {
    const name = document.getElementById('np_name').value.trim();
    const emr = document.getElementById('np_emr').value.trim();
    const msgBox = document.getElementById('npMsg');
    msgBox.innerHTML = '';
    if (!name || !emr) {
      msgBox.innerHTML = '<div class="error-msg">Name and EMR number are required.</div>';
      return;
    }
    const data = {
      name, emr,
      diagnosis: document.getElementById('np_diagnosis').value.trim(),
      ward: document.getElementById('np_ward').value.trim(),
      age: document.getElementById('np_age').value.trim(),
      hospNo: document.getElementById('np_hospno').value.trim(),
      admissionDate: document.getElementById('np_admission').value.trim(),
      allergies: document.getElementById('np_allergies').value.trim(),
      createdAt: serverTimestamp(),
      createdBy: window.currentUser ? window.currentUser.uid : null
    };
    let ref;
    try {
      ref = await addDoc(collection(db, 'patients'), data);
    } catch (e) {
      msgBox.innerHTML = '<div class="error-msg">Save failed: ' + (e.code || e.message || 'unknown error') + '</div>';
      return;
    }
    await loadAllPatients(true);
    hideNewPatientForm();
    ['np_name','np_emr','np_diagnosis','np_ward','np_age','np_hospno','np_admission','np_allergies'].forEach(id => document.getElementById(id).value = '');
    msgBox.innerHTML = '';
    selectPatient({ id: ref.id, ...data });
  };

  window.openChart = function (chartName) {
    if (!selectedPatient) return;
    window.location.href = 'charts/' + chartName + '.html?patient=' + selectedPatient.id;
  };

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
