<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Ward Charts · Home</title>
<link rel="stylesheet" href="js/styles.css">
<style>
  .whoami-link { display:flex; align-items:center; gap:8px; text-decoration:none; }
  .whoami-avatar { width:32px; height:32px; border-radius:50%; overflow:hidden; flex-shrink:0; }
  .whoami-name {
    font-weight:bold;
    background: linear-gradient(100deg, #b8860b 0%, #ffe985 25%, #ffd700 50%, #ffe985 75%, #b8860b 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shineGold 3s linear infinite;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.35);
  }
  @keyframes shineGold {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
</style>
</head>
<body>
<script type="module" src="js/nav.js"></script>
<div class="topbar">
  <div class="brand">68 NARHY Ward Charts</div>
  <div class="right">
    <a id="whoami" href="profile.html" class="whoami-link">
      <span class="whoami-avatar" id="whoami_avatar"></span>
      <span class="whoami-name" id="whoami_name"></span>
    </a>
    <a id="adminLink" href="admin.html" class="btn btn-purple" style="display:none; padding:6px 12px;">Admin</a>
  </div>
</div>

<div class="container">
  <div class="card-box">
    <label>Search Patient (EMR number or name)</label>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="e.g. EMR12345 or John Doe" onkeydown="if(event.key==='Enter') doSearch();">
      <button class="btn btn-primary" onclick="doSearch()">Search</button>
      <button class="btn btn-success" onclick="showNewPatientForm()">+ New Patient</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="card-box" id="newPatientBox" style="display:none;">
    <h3 style="margin-top:0;">Register New Patient</h3>
    <div class="field"><label>Name</label><input type="text" id="np_name"></div>
    <div class="field"><label>EMR Number</label><input type="text" id="np_emr"></div>
    <div class="field"><label>Diagnosis</label><input type="text" id="np_diagnosis"></div>
    <div class="field"><label>Ward</label><input type="text" id="np_ward"></div>
    <div class="field"><label>Age</label><input type="text" id="np_age"></div>
    <div class="field"><label>Hospital No</label><input type="text" id="np_hospno"></div>
    <div class="field"><label>Date of Admission</label><input type="date" id="np_admission"></div>
    <div class="field"><label>Allergies</label><input type="text" id="np_allergies" placeholder="None known / list allergies"></div>
    <button class="btn btn-primary" onclick="createPatient()">Save Patient</button>
    <button class="btn btn-secondary" onclick="hideNewPatientForm()">Cancel</button>
    <div id="npMsg"></div>
  </div>

  <div class="card-box" id="patientBox" style="display:none;">
    <div class="patient-banner">
      <div>
        <div class="pname" id="pb_name"></div>
        <div class="pmeta" id="pb_meta" style="display:inline;"></div>
        <button class="btn btn-secondary edit-patient-btn" id="editPatientBtn" title="Edit patient information" onclick="openEditPatient()">✎</button>
        <button class="btn btn-purple" id="overviewBtn" style="padding:4px 10px; font-size:12px; margin-left:6px;" onclick="openOverview()">Overview</button>
        <button class="btn btn-secondary" id="allocateBtn" style="padding:4px 10px; font-size:12px; margin-left:6px;" onclick="toggleAllocation()">Allocate to Me</button>
      </div>
    </div>
    <div id="pb_allergy"></div>

    <div class="card-box" id="editPatientBox" style="display:none; margin-top:12px; box-shadow:none; border:1px solid #e5e7eb;">
      <h3 style="margin-top:0;">Edit Patient Information</h3>
      <div class="field"><label>Name</label><input type="text" id="ep_name"></div>
      <div class="field"><label>EMR Number</label><input type="text" id="ep_emr"></div>
      <div class="field"><label>Diagnosis</label><input type="text" id="ep_diagnosis"></div>
      <div class="field"><label>Ward</label><input type="text" id="ep_ward"></div>
      <div class="field"><label>Age</label><input type="text" id="ep_age"></div>
      <div class="field"><label>Hospital No</label><input type="text" id="ep_hospno"></div>
      <div class="field"><label>Date of Admission</label><input type="date" id="ep_admission"></div>
      <div class="field"><label>Allergies</label><input type="text" id="ep_allergies" placeholder="None known / list allergies"></div>
      <button class="btn btn-primary" onclick="saveEditPatient()">Save Changes</button>
      <button class="btn btn-secondary" onclick="closeEditPatient()">Cancel</button>
      <div id="epMsg"></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card" onclick="openChart('drug-course-chart')"><span class="icon">💊</span>Drug Course Chart</div>
      <div class="chart-card" onclick="openChart('vitals')"><span class="icon">❤️</span>Vital Signs</div>
      <div class="chart-card" onclick="openChart('intake-output')"><span class="icon">💧</span>Intake &amp; Output</div>
      <div class="chart-card" onclick="openChart('blood-glucose')"><span class="icon">🩸</span>Blood Glucose</div>
      <div class="chart-card" onclick="openChart('seizure')"><span class="icon">⚡</span>Seizure Chart</div>
      <div class="chart-card" onclick="openCalculators()"><span class="icon">🧮</span>Calculators</div>
      <div class="chart-card" onclick="openLabReference()"><span class="icon">🔬</span>Lab Reference</div>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from "./js/auth-guard.js";
  import { db } from "./js/firebase.js";
  import { collection, getDocs, updateDoc, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { avatarMarkup } from "./js/avatar.js";

  let selectedPatient = null;
  let allPatientsCache = null;
  // Whether the currently-selected patient is allocated to *this* signed-in
  // nurse specifically (a different nurse may also have allocated the same
  // patient — allocation isn't exclusive — that's not tracked here, only
  // "is it in mine").
  let allocatedToMe = false;

  requireAuth((user, profile) => {
    document.getElementById('whoami_avatar').innerHTML = avatarMarkup(profile, 32);
    const title = profile.role === 'nurse' ? 'Nr.' : (profile.role ? profile.role.charAt(0).toUpperCase() + profile.role.slice(1) : '');
    document.getElementById('whoami_name').textContent = (title ? title + ' ' : '') + (profile.name || '');
    if (profile.role === 'admin') document.getElementById('adminLink').style.display = 'inline-block';
    if (window.location.hash === '#search') {
      const input = document.getElementById('searchInput');
      if (input) { input.scrollIntoView({ behavior: 'smooth', block: 'center' }); input.focus(); }
    }
    restoreSelectedPatient();
  });

  // Keeps the currently open patient showing when navigating back to this page
  // (e.g. via the Back button on a chart), instead of losing the selection.
  // Only replaced when the user searches for and picks a different patient.
  const SELECTED_PATIENT_KEY = 'selectedPatientId';

  async function restoreSelectedPatient() {
    const storedId = sessionStorage.getItem(SELECTED_PATIENT_KEY);
    if (!storedId) return;
    try {
      const snap = await getDoc(doc(db, 'patients', storedId));
      if (snap.exists()) {
        selectPatient({ id: snap.id, ...snap.data() });
      } else {
        sessionStorage.removeItem(SELECTED_PATIENT_KEY);
      }
    } catch (e) {
      // If restore fails (offline, permissions, etc.) just leave the search screen showing.
    }
  }

  async function loadAllPatients(force) {
    if (allPatientsCache && !force) return allPatientsCache;
    const snap = await getDocs(collection(db, 'patients'));
    allPatientsCache = [];
    snap.forEach(d => allPatientsCache.push({ id: d.id, ...d.data() }));
    return allPatientsCache;
  }

  window.doSearch = async function () {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if (!q) { results.innerHTML = ''; return; }
    results.innerHTML = 'Searching…';
    const patients = await loadAllPatients();
    const matches = patients.filter(p =>
      (p.emr || '').toLowerCase().includes(q) || (p.name || '').toLowerCase().includes(q)
    );
    if (matches.length === 0) {
      results.innerHTML = '<div class="error-msg">No patient found. Use "+ New Patient" to register them.</div>';
      return;
    }
    results.innerHTML = '';
    matches.forEach(p => {
      const div = document.createElement('div');
      div.className = 'search-result-item';
      div.innerHTML = '<span><b>' + escapeHtml(p.name || 'Unnamed') + '</b> — EMR: ' + escapeHtml(p.emr || 'N/A') + '</span><span>' + escapeHtml(p.diagnosis || '') + '</span>';
      div.onclick = () => selectPatient(p);
      results.appendChild(div);
    });
  };

  function selectPatient(p) {
    selectedPatient = p;
    sessionStorage.setItem(SELECTED_PATIENT_KEY, p.id);
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('newPatientBox').style.display = 'none';
    document.getElementById('pb_name').textContent = p.name || 'Unnamed';
    document.getElementById('pb_meta').textContent = 'EMR: ' + (p.emr || 'N/A') + '   |   Diagnosis: ' + (p.diagnosis || 'Not specified');
    const allergyBox = document.getElementById('pb_allergy');
    const allergyVal = (p.allergies || '').trim();
    if (allergyVal && !/^(none|nil|none known)$/i.test(allergyVal)) {
      allergyBox.innerHTML = '<div class="allergy-alert">ALLERGY ALERT: ' + escapeHtml(allergyVal) + '</div>';
    } else {
      allergyBox.innerHTML = '';
    }
    closeEditPatient();
    document.getElementById('patientBox').style.display = 'block';
    refreshAllocateBtn();
  }

  // Allocation ends only when a nurse manually removes it (here, or from
  // allocation.html) — there's no automatic clearing at shift change, since
  // allocation isn't exclusive: if a nurse forgets to deallocate at end of
  // shift, that doesn't block the next nurse from allocating the same
  // patient to themselves too. One doc per (nurse, patient) pair, so this
  // ID is stable and idempotent to create/overwrite/delete regardless of
  // how many other nurses have their own allocation doc for the same
  // patient.
  function allocationDocRef(patientId) {
    return doc(db, 'allocations', 'alloc_' + window.currentUser.uid + '_' + patientId);
  }

  // Recorded on the allocation doc purely for handover visibility on
  // allocation.html ("allocated 07:32am · Morning shift") — Africa/Lagos
  // (WAT) is UTC+1 with no DST, so shifting the UTC clock by 1hr gives WAT
  // wall-clock hours via the UTC getters. Morning 8:00–16:59, Night
  // 17:00–7:59.
  function currentShiftLabel() {
    const watHour = new Date(Date.now() + 60 * 60 * 1000).getUTCHours();
    return (watHour >= 8 && watHour < 17) ? 'Morning' : 'Night';
  }

  function refreshAllocateBtn() {
    const btn = document.getElementById('allocateBtn');
    if (!selectedPatient || !window.currentUser) { btn.style.display = 'none'; return; }
    btn.style.display = 'inline-block';
    btn.disabled = true;
    btn.textContent = '…';
    getDoc(allocationDocRef(selectedPatient.id)).then(snap => {
      allocatedToMe = snap.exists();
      applyAllocateBtnStyle(btn);
    }).catch(() => {
      // Can't confirm current state (offline, etc.) — leave the button
      // usable rather than stuck disabled; toggleAllocation() re-derives
      // the actual state from its own write attempt either way.
      allocatedToMe = false;
      applyAllocateBtnStyle(btn);
    });
  }

  function applyAllocateBtnStyle(btn) {
    btn.disabled = false;
    if (allocatedToMe) {
      btn.className = 'btn btn-success';
      btn.textContent = '✓ Allocated — tap to remove';
    } else {
      btn.className = 'btn btn-secondary';
      btn.textContent = 'Allocate to Me';
    }
  }

  window.toggleAllocation = async function () {
    if (!selectedPatient || !window.currentUser) return;
    const btn = document.getElementById('allocateBtn');
    btn.disabled = true;
    const ref = allocationDocRef(selectedPatient.id);
    // Not awaited — same offline-hang reason as createPatient above: these
    // queue locally and sync automatically once back online.
    if (allocatedToMe) {
      deleteDoc(ref).catch((e) => console.warn('Allocation removal queued locally; will retry once back online:', e));
      allocatedToMe = false;
    } else {
      setDoc(ref, {
        uid: window.currentUser.uid,
        nurseName: (window.currentUserProfile && window.currentUserProfile.name) || '',
        patientId: selectedPatient.id,
        patientName: selectedPatient.name || 'Unnamed',
        patientEmr: selectedPatient.emr || '',
        patientWard: selectedPatient.ward || '',
        patientDiagnosis: selectedPatient.diagnosis || '',
        shift: currentShiftLabel(),
        allocatedAt: serverTimestamp()
      }).catch((e) => console.warn('Allocation queued locally; will retry once back online:', e));
      allocatedToMe = true;
    }
    applyAllocateBtnStyle(btn);
  };

  window.openEditPatient = function () {
    if (!selectedPatient) return;
    const p = selectedPatient;
    document.getElementById('ep_name').value = p.name || '';
    document.getElementById('ep_emr').value = p.emr || '';
    document.getElementById('ep_diagnosis').value = p.diagnosis || '';
    document.getElementById('ep_ward').value = p.ward || '';
    document.getElementById('ep_age').value = p.age || '';
    document.getElementById('ep_hospno').value = p.hospNo || '';
    document.getElementById('ep_admission').value = p.admissionDate || '';
    document.getElementById('ep_allergies').value = p.allergies || '';
    document.getElementById('epMsg').innerHTML = '';
    document.getElementById('editPatientBox').style.display = 'block';
  };

  window.closeEditPatient = function () {
    document.getElementById('editPatientBox').style.display = 'none';
  };

  window.saveEditPatient = async function () {
    if (!selectedPatient) return;
    const name = document.getElementById('ep_name').value.trim();
    const emr = document.getElementById('ep_emr').value.trim();
    const msgBox = document.getElementById('epMsg');
    msgBox.innerHTML = '';
    if (!name || !emr) {
      msgBox.innerHTML = '<div class="error-msg">Name and EMR number are required.</div>';
      return;
    }
    const updates = {
      name, emr,
      diagnosis: document.getElementById('ep_diagnosis').value.trim(),
      ward: document.getElementById('ep_ward').value.trim(),
      age: document.getElementById('ep_age').value.trim(),
      hospNo: document.getElementById('ep_hospno').value.trim(),
      admissionDate: document.getElementById('ep_admission').value.trim(),
      allergies: document.getElementById('ep_allergies').value.trim(),
      updatedAt: serverTimestamp()
    };
    // Not awaited — same offline-hang reason as createPatient above.
    updateDoc(doc(db, 'patients', selectedPatient.id), updates).catch((e) => {
      console.warn('Patient edit queued locally; will retry once back online:', e);
    });
    const updatedPatient = { ...selectedPatient, ...updates };
    delete updatedPatient.updatedAt;
    if (allPatientsCache) allPatientsCache = allPatientsCache.map(p => p.id === selectedPatient.id ? { ...p, ...updatedPatient } : p);
    selectPatient(updatedPatient);
  };

  window.showNewPatientForm = function () { document.getElementById('newPatientBox').style.display = 'block'; };
  window.hideNewPatientForm = function () { document.getElementById('newPatientBox').style.display = 'none'; };

  window.createPatient = async function () {
    const name = document.getElementById('np_name').value.trim();
    const emr = document.getElementById('np_emr').value.trim();
    const msgBox = document.getElementById('npMsg');
    msgBox.innerHTML = '';
    if (!name || !emr) {
      msgBox.innerHTML = '<div class="error-msg">Name and EMR number are required.</div>';
      return;
    }
    const data = {
      name, emr,
      diagnosis: document.getElementById('np_diagnosis').value.trim(),
      ward: document.getElementById('np_ward').value.trim(),
      age: document.getElementById('np_age').value.trim(),
      hospNo: document.getElementById('np_hospno').value.trim(),
      admissionDate: document.getElementById('np_admission').value.trim(),
      allergies: document.getElementById('np_allergies').value.trim(),
      createdAt: serverTimestamp(),
      createdBy: window.currentUser ? window.currentUser.uid : null
    };
    // Client-generated ID (no network round trip needed) so the patient is
    // usable immediately even offline. setDoc()'s Promise is deliberately
    // NOT awaited: with offline persistence, the write lands in the local
    // IndexedDB cache synchronously and syncs automatically once back
    // online, but the Promise itself only resolves after the backend
    // acknowledges it — awaiting it here is what made "Save Patient" hang
    // forever with no error while offline.
    const ref = doc(collection(db, 'patients'));
    setDoc(ref, data).catch((e) => console.warn('Patient write queued locally; will retry once back online:', e));

    allPatientsCache = allPatientsCache ? [...allPatientsCache, { id: ref.id, ...data }] : [{ id: ref.id, ...data }];
    hideNewPatientForm();
    ['np_name','np_emr','np_diagnosis','np_ward','np_age','np_hospno','np_admission','np_allergies'].forEach(id => document.getElementById(id).value = '');
    msgBox.innerHTML = '';
    selectPatient({ id: ref.id, ...data });
  };

  window.openChart = function (chartName) {
    if (!selectedPatient) return;
    window.location.href = 'charts/' + chartName + '.html?patient=' + selectedPatient.id;
  };

  window.openOverview = function () {
    if (!selectedPatient) return;
    window.location.href = 'charts/overview.html?patient=' + selectedPatient.id;
  };

  window.openCalculators = function () {
    // Reference tool, independent of any single patient — still pass the
    // current patient (if one is selected) so the page can show their
    // banner for orientation, but never require one.
    window.location.href = 'charts/calculators.html' + (selectedPatient ? ('?patient=' + selectedPatient.id) : '');
  };

  window.openLabReference = function () {
    window.location.href = 'charts/lab-reference.html';
  };

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
