<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drugs Course Chart</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    margin: 0;
    padding: 20px;
    color: #000;
  }
  .toolbar {
    max-width: 900px;
    margin: 0 auto 16px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }
  .toolbar .group { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button, .toolbar select, .toolbar label.filebtn {
    padding: 9px 14px;
    font-size: 13px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #printBtn { background: #2563eb; color: #fff; }
  #addRowBtn { background: #16a34a; color: #fff; }
  #removeRowBtn { background: #dc2626; color: #fff; }
  #saveBtn { background: #7c3aed; color: #fff; }
  #newBtn { background: #ea580c; color: #fff; }
  #logoBtn { background: #0891b2; color: #fff; display: inline-block; }
  #logoInput { display: none; }
  #loadSelect { background: #fff; border: 1px solid #999; }
  .save-status {
    font-size: 12px;
    color: #555;
    text-align: right;
    max-width: 900px;
    margin: 0 auto 10px auto;
  }

  .sheet {
    background: #fff;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 45px;
    border: 1px solid #ccc;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  #logoPreview {
    max-height: 60px;
    max-width: 60px;
    display: none;
    object-fit: contain;
  }
  .header h1 {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 30px;
    letter-spacing: 0.5px;
    margin: 0;
    text-align: center;
    text-transform: uppercase;
  }
  .header-sub {
    display: flex;
    justify-content: center;
    align-items: baseline;
    position: relative;
    margin: 6px 0 18px 0;
  }
  .header-sub h2 {
    font-size: 22px;
    text-decoration: underline;
    text-align: center;
    margin: 0;
    letter-spacing: 1px;
  }
  .rim-note {
    position: absolute;
    right: 0;
    top: 0;
    font-size: 12px;
    font-style: italic;
  }

  .allergy-banner {
    display: none;
    background: #fee2e2;
    border: 2px solid #dc2626;
    color: #7f1d1d;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 16px;
    text-align: center;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 40px;
    row-gap: 10px;
    margin-bottom: 6px;
  }
  .info-row {
    display: flex;
    align-items: baseline;
    font-size: 15px;
    white-space: nowrap;
  }
  .info-row label {
    font-weight: bold;
    margin-right: 6px;
  }
  .info-row input {
    flex: 1;
    border: none;
    border-bottom: 1px solid #000;
    font-size: 15px;
    padding: 2px 4px;
    outline: none;
    background: transparent;
    min-width: 0;
  }
  .allergy-field input {
    border-bottom: 1px solid #dc2626;
    font-weight: bold;
    color: #b91c1c;
  }

  .drugs-block {
    margin-top: 10px;
    margin-bottom: 18px;
  }
  .drugs-block .drugs-title {
    font-weight: bold;
    font-size: 15px;
    display: flex;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .drugs-block .drugs-title input {
    flex: 1;
    border: none;
    border-bottom: 1px solid #000;
    font-size: 15px;
    padding: 2px 4px;
    outline: none;
    background: transparent;
    margin-left: 6px;
    max-width: 400px;
  }
  .drug-num-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 40px;
    row-gap: 4px;
  }
  .drug-num-row {
    display: flex;
    align-items: baseline;
    font-size: 15px;
  }
  .drug-num-row span {
    width: 22px;
    flex-shrink: 0;
  }
  .drug-num-row input {
    flex: 1;
    border: none;
    border-bottom: 1px solid #000;
    font-size: 15px;
    padding: 2px 4px;
    outline: none;
    background: transparent;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    table-layout: fixed;
  }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  th, td {
    border: 1px solid #000;
    padding: 6px 4px;
    font-size: 13px;
    text-align: center;
  }
  th {
    background: #f2f2f2;
    font-weight: bold;
    text-transform: uppercase;
  }
  td input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;
    font-size: 13px;
    font-family: inherit;
    padding: 4px 2px;
  }
  col.date { width: 11%; }
  col.drug { width: 24%; }
  col.time { width: 11%; }
  col.dose { width: 11%; }
  col.route { width: 11%; }
  col.sign { width: 16%; }
  col.remark { width: 16%; }

  .footer-note {
    margin-top: 14px;
    font-size: 12px;
    color: #444;
    display: flex;
    justify-content: space-between;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .save-status { display: none; }
    .sheet { border: none; padding: 15px 25px; max-width: 100%; }
    input { border-bottom: 1px solid #000 !important; }
    .allergy-field input { border-bottom: 1px solid #dc2626 !important; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group">
    <button id="newBtn" onclick="newChart()">New Chart</button>
    <button id="saveBtn" onclick="saveChart()">Save</button>
    <select id="loadSelect" onchange="loadChart(this.value)">
      <option value="">Load saved chart…</option>
    </select>
    <button id="removeRowBtn" onclick="deleteSelectedChart()" title="Delete the chart currently selected in the dropdown">Delete Saved</button>
  </div>
  <div class="group">
    <label class="filebtn" id="logoBtn">Upload Logo
      <input type="file" id="logoInput" accept="image/*" onchange="handleLogo(event)">
    </label>
    <button id="addRowBtn" onclick="addRow(1)">+ Add Row</button>
    <button onclick="removeRow()" style="background:#6b7280;color:#fff;">− Remove Row</button>
    <button id="printBtn" onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>
<div class="save-status" id="saveStatus">Not saved yet</div>

<div class="sheet" id="sheet">
  <div class="brand-row">
    <img id="logoPreview" alt="Hospital Logo">
    <div class="header">
      <h1>68 Nigerian Army Reference Hospital Yaba</h1>
    </div>
  </div>
  <div class="header-sub">
    <h2>Drugs Course Chart</h2>
    <span class="rim-note">10 rim front only</span>
  </div>

  <div class="allergy-banner" id="allergyBanner"></div>

  <div class="info-grid">
    <div class="info-row">
      <label>NAME:</label>
      <input type="text" id="f_name">
    </div>
    <div class="info-row">
      <label>Date of Admission:</label>
      <input type="text" id="f_admission">
    </div>
    <div class="info-row">
      <label>WARD:</label>
      <input type="text" id="f_ward">
    </div>
    <div class="info-row">
      <label>EMR:</label>
      <input type="text" id="f_emr">
    </div>
    <div class="info-row">
      <label>AGE:</label>
      <input type="text" id="f_age">
    </div>
    <div class="info-row">
      <label>Hospital No:</label>
      <input type="text" id="f_hospno">
    </div>
    <div class="info-row">
      <label>Doctor:</label>
      <input type="text" id="f_doctor">
    </div>
    <div class="info-row">
      <label>Discharge Date:</label>
      <input type="text" id="f_discharge">
    </div>
    <div class="info-row allergy-field" style="grid-column: 1 / -1;">
      <label>ALLERGIES:</label>
      <input type="text" id="f_allergies" placeholder="None known / list allergies">
    </div>
  </div>

  <div class="drugs-block">
    <div class="drugs-title">DRUGS: <input type="text" id="f_drugsHeader"></div>
    <div class="drug-num-list" id="drugNumList">
      <div class="drug-num-row"><span>1</span><input type="text" id="d1"></div>
      <div class="drug-num-row"><span>5</span><input type="text" id="d5"></div>
      <div class="drug-num-row"><span>2</span><input type="text" id="d2"></div>
      <div class="drug-num-row"><span>6</span><input type="text" id="d6"></div>
      <div class="drug-num-row"><span>3</span><input type="text" id="d3"></div>
      <div class="drug-num-row"><span>7</span><input type="text" id="d7"></div>
      <div class="drug-num-row"><span>4</span><input type="text" id="d4"></div>
      <div class="drug-num-row"><span>8</span><input type="text" id="d8"></div>
    </div>
  </div>

  <table id="chartTable">
    <colgroup>
      <col class="date"><col class="drug"><col class="time"><col class="dose"><col class="route"><col class="sign"><col class="remark">
    </colgroup>
    <thead>
      <tr>
        <th>Date</th>
        <th>Drug S/No</th>
        <th>Time</th>
        <th>Dose</th>
        <th>Route</th>
        <th>Signature</th>
        <th>Remark</th>
      </tr>
    </thead>
    <tbody id="chartBody"></tbody>
  </table>

  <div class="footer-note">
    <span id="lastSavedNote"></span>
    <span id="printedNote"></span>
  </div>
</div>

<script>
  const STORAGE_KEY = 'dcc_charts_v1';
  const DRAFT_KEY = 'dcc_draft_v1';
  const fieldIds = ['f_name','f_admission','f_ward','f_emr','f_age','f_hospno','f_doctor','f_discharge','f_allergies','f_drugsHeader','d1','d2','d3','d4','d5','d6','d7','d8'];

  function getStore() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function setStore(store) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }

  function addRow(count, dataRow) {
    const tbody = document.getElementById('chartBody');
    const times = count || 1;
    for (let i = 0; i < times; i++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < 7; c++) {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'text';
        if (dataRow && dataRow[c] !== undefined) input.value = dataRow[c];
        input.addEventListener('input', autosaveDraft);
        td.appendChild(input);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }
  function removeRow() {
    const tbody = document.getElementById('chartBody');
    if (tbody.rows.length > 0) {
      tbody.deleteRow(tbody.rows.length - 1);
      autosaveDraft();
    }
  }

  function collectData() {
    const data = {};
    fieldIds.forEach(id => { data[id] = document.getElementById(id).value; });
    const rows = [];
    document.querySelectorAll('#chartBody tr').forEach(tr => {
      const cells = [];
      tr.querySelectorAll('input').forEach(inp => cells.push(inp.value));
      rows.push(cells);
    });
    data.rows = rows;
    data.logo = document.getElementById('logoPreview').src || '';
    return data;
  }

  function applyData(data) {
    fieldIds.forEach(id => { document.getElementById(id).value = (data[id] || ''); });
    document.getElementById('chartBody').innerHTML = '';
    const rows = data.rows && data.rows.length ? data.rows : Array(18).fill(['','','','','','','']);
    rows.forEach(r => addRow(1, r));
    if (data.logo) {
      document.getElementById('logoPreview').src = data.logo;
      document.getElementById('logoPreview').style.display = 'inline-block';
    } else {
      document.getElementById('logoPreview').style.display = 'none';
    }
    updateAllergyBanner();
  }

  function updateAllergyBanner() {
    const val = document.getElementById('f_allergies').value.trim();
    const banner = document.getElementById('allergyBanner');
    if (val && val.toLowerCase() !== 'none' && val.toLowerCase() !== 'none known' && val.toLowerCase() !== 'nil') {
      banner.style.display = 'block';
      banner.textContent = 'ALLERGY ALERT: ' + val;
    } else {
      banner.style.display = 'none';
      banner.textContent = '';
    }
  }

  function newChart() {
    if (!confirm('Start a new blank chart? Unsaved changes will be lost.')) return;
    fieldIds.forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('chartBody').innerHTML = '';
    document.getElementById('logoPreview').style.display = 'none';
    document.getElementById('logoPreview').src = '';
    addRow(18);
    updateAllergyBanner();
    document.getElementById('saveStatus').textContent = 'Not saved yet';
    localStorage.removeItem(DRAFT_KEY);
  }

  function saveChart() {
    const data = collectData();
    const name = (data.f_name || 'Unnamed patient').trim();
    const hospno = (data.f_hospno || '').trim();
    const key = (hospno ? hospno + '_' : '') + name + '_' + Date.now();
    const store = getStore();
    store[key] = { label: name + (hospno ? ' (' + hospno + ')' : ''), savedAt: new Date().toLocaleString(), data };
    setStore(store);
    refreshLoadOptions();
    document.getElementById('saveStatus').textContent = 'Saved as "' + store[key].label + '" at ' + store[key].savedAt;
  }

  function refreshLoadOptions() {
    const select = document.getElementById('loadSelect');
    const store = getStore();
    select.innerHTML = '<option value="">Load saved chart…</option>';
    Object.keys(store).sort((a,b) => store[b].savedAt.localeCompare(store[a].savedAt)).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = store[key].label + ' — ' + store[key].savedAt;
      select.appendChild(opt);
    });
  }

  function loadChart(key) {
    if (!key) return;
    const store = getStore();
    if (store[key]) {
      applyData(store[key].data);
      document.getElementById('saveStatus').textContent = 'Loaded "' + store[key].label + '"';
    }
  }

  function deleteSelectedChart() {
    const select = document.getElementById('loadSelect');
    const key = select.value;
    if (!key) { alert('Select a saved chart from the dropdown first.'); return; }
    if (!confirm('Delete this saved chart? This cannot be undone.')) return;
    const store = getStore();
    delete store[key];
    setStore(store);
    refreshLoadOptions();
    document.getElementById('saveStatus').textContent = 'Deleted saved chart';
  }

  function handleLogo(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById('logoPreview');
      img.src = e.target.result;
      img.style.display = 'inline-block';
      autosaveDraft();
    };
    reader.readAsDataURL(file);
  }

  let autosaveTimer = null;
  function autosaveDraft() {
    updateAllergyBanner();
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      const data = collectData();
      localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
      document.getElementById('saveStatus').textContent = 'Draft autosaved ' + new Date().toLocaleTimeString();
    }, 500);
  }

  // wire up autosave listeners
  fieldIds.forEach(id => document.getElementById(id).addEventListener('input', autosaveDraft));

  // init
  const draft = localStorage.getItem(DRAFT_KEY);
  if (draft) {
    try { applyData(JSON.parse(draft)); }
    catch (e) { addRow(18); }
  } else {
    addRow(18);
  }
  refreshLoadOptions();
</script>

</body>
</html>
