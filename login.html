<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Login · 68 NARHY Ward Charts</title>
<link rel="stylesheet" href="js/styles.css">
</head>
<body>
<div class="container" style="max-width:420px; margin-top:60px;">
  <div class="card-box">
    <h2 style="text-align:center; margin-top:0;">68 NARHY Ward Charts</h2>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Log In</button>

    <div style="text-align:center; margin-top:12px;">
      <a href="#" onclick="doReset(); return false;" style="font-size:13px; color:#2563eb;">Forgot password?</a>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script type="module">
  import { auth } from "./js/firebase.js";
  import {
    signInWithEmailAndPassword, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  window.doLogin = async function () {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.innerHTML = '';
    if (!email || !password) {
      msg.innerHTML = '<div class="error-msg">Enter your email and password.</div>';
      return;
    }
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'index.html';
    } catch (e) {
      msg.innerHTML = '<div class="error-msg">' + friendlyError(e) + '</div>';
    }
  };

  window.doReset = async function () {
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('msg');
    if (!email) {
      msg.innerHTML = '<div class="error-msg">Enter your email above first, then click "Forgot password?".</div>';
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      msg.innerHTML = '<div class="info-msg">Password reset link sent to ' + email + '. Check your inbox (and spam folder).</div>';
    } catch (e) {
      msg.innerHTML = '<div class="error-msg">' + friendlyError(e) + '</div>';
    }
  };

  function friendlyError(e) {
    const code = e.code || '';
    if (code.includes('user-not-found') || code.includes('invalid-credential') || code.includes('wrong-password')) return 'Incorrect email or password.';
    if (code.includes('too-many-requests')) return 'Too many attempts. Please try again later.';
    if (code.includes('invalid-email')) return 'Enter a valid email address.';
    // Temporary: show the raw code/message for anything unmatched, so a
    // failure specific to the wrapped Android app (vs. the plain web app)
    // can actually be diagnosed instead of hiding behind one generic
    // string. Safe to revert to a plain "Something went wrong" once the
    // native login path is confirmed working.
    return 'Something went wrong (' + (code || e.message || 'unknown error') + '). Please try again.';
  }
</script>
</body>
</html>
