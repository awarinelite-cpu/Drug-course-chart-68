<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Analytics</title>
<link rel="stylesheet" href="../js/styles.css">
<style>
  .period-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .period-btn {
    flex: 1 1 auto; min-width: 90px; padding: 10px 8px; border-radius: 8px; border: 2px solid #e5e7eb;
    background: #fff; font-weight: bold; font-size: 13px; color: #374151; cursor: pointer;
  }
  .period-btn.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
  .range-label { font-size: 12px; color: #6b7280; margin-top: 8px; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
  @media (min-width: 480px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
  .stat-box { background: #f9fafb; border-radius: 8px; padding: 12px 8px; text-align: center; }
  .stat-box .n { font-size: 22px; font-weight: 900; color: #111827; }
  .stat-box .l { font-size: 11px; text-transform: uppercase; color: #6b7280; margin-top: 2px; }
  .stat-box.demo { background: #eff6ff; }
  .card-box > h2 { margin: 0 0 4px 0; font-weight: bold; font-size: 17px; }
  .card-box > h3 { margin: 18px 0 4px 0; font-weight: bold; font-size: 14px; color: #374151; }
  .chart-wrap { position: relative; height: 260px; margin-top: 10px; }
  .pie-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 10px; }
  @media (min-width: 640px) { .pie-grid { grid-template-columns: 1fr 1fr; } }
  .loading-note { font-size: 12px; color: #6b7280; margin-top: 8px; }
  .empty-note { font-size: 13px; color: #6b7280; text-align: center; padding: 16px 0; }
</style>
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="topbar">
  <div class="brand">Analytics</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('role-select.html')">Back</button>
  </div>
</div>

<div class="container">

  <div class="card-box">
    <h1 style="margin:0; font-size:18px;">Hospital Statistics</h1>
    <div class="period-row">
      <button class="period-btn" data-period="today">Today</button>
      <button class="period-btn" data-period="week">This Week</button>
      <button class="period-btn" data-period="month">This Month</button>
      <button class="period-btn" data-period="year">This Year</button>
    </div>
    <div class="range-label" id="rangeLabel"></div>
    <div class="loading-note" id="loadingNote" style="display:none;">Loading…</div>
  </div>

  <div class="card-box" id="summaryCard" style="display:none;">
    <h2>Summary</h2>
    <div class="stat-grid" id="clinicalGrid"></div>
    <h3>Patient Demographics</h3>
    <div class="stat-grid" id="demoGrid"></div>
  </div>

  <div class="card-box" id="chartsCard" style="display:none;">
    <h2>Admission, Death, BID, C/S, Del</h2>
    <div class="chart-wrap"><canvas id="barChart"></canvas></div>

    <div class="pie-grid">
      <div>
        <h3>Male / Female / Children</h3>
        <div class="chart-wrap" style="height:220px;"><canvas id="sexPie"></canvas></div>
      </div>
      <div>
        <h3>Soldiers / Civilians</h3>
        <div class="chart-wrap" style="height:220px;"><canvas id="affiliationPie"></canvas></div>
      </div>
    </div>
  </div>

  <div class="card-box" id="emptyCard" style="display:none;">
    <div class="empty-note">No archived or live reports found for this period.</div>
  </div>

</div>

<script type="module">
  import { requireAuth } from "../js/auth-guard.js";
  import { db } from "../js/firebase.js";
  import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { WARDS, DEMOGRAPHIC_FIELDS, reportDateId, weekId } from "../js/nurses-report-common.js";

  // The five clinical figures shown on this page (a deliberate subset of
  // STAT_FIELDS — the ones relevant to trend analysis, not every column
  // on the Overall Statistics table).
  const CLINICAL_FIELDS = [
    { key: 'adm',   label: 'Admission' },
    { key: 'death', label: 'Death' },
    { key: 'bid',   label: 'BID' },
    { key: 'cs',    label: 'C/S' },
    { key: 'del',   label: 'Del' }
  ];

  function pad(n) { return String(n).padStart(2, '0'); }

  function computeRange(period) {
    const todayId = reportDateId();
    const [ty, tm] = todayId.split('-').map(Number);
    let startId;
    if (period === 'today') startId = todayId;
    else if (period === 'week') startId = weekId();
    else if (period === 'month') startId = ty + '-' + pad(tm) + '-01';
    else startId = ty + '-01-01';
    return { startId, endId: todayId, todayId };
  }

  function fmtDate(dateId) {
    const [y, m, d] = dateId.split('-');
    return d + '/' + m + '/' + y;
  }

  // Sums CLINICAL_FIELDS + DEMOGRAPHIC_FIELDS across every ward in one
  // "wards" map (the shape both an archived overall doc and a live day's
  // set of ward docs share).
  function sumWardsMap(wardsMap, into) {
    WARDS.forEach(w => {
      const data = (wardsMap && wardsMap[w.key]) || {};
      CLINICAL_FIELDS.forEach(f => { into[f.key] += typeof data[f.key] === 'number' ? data[f.key] : 0; });
      DEMOGRAPHIC_FIELDS.forEach(f => { into[f.key] += typeof data[f.key] === 'number' ? data[f.key] : 0; });
    });
  }

  function blankTotals() {
    const t = {};
    CLINICAL_FIELDS.forEach(f => { t[f.key] = 0; });
    DEMOGRAPHIC_FIELDS.forEach(f => { t[f.key] = 0; });
    return t;
  }

  // Pulls every archived "overall" day within [startId, endId], sums them,
  // then — since a day isn't archived until the Overall Nurse saves it —
  // separately reads today's live ward docs and adds them in if today
  // falls in range and wasn't already covered by an archive.
  async function loadTotals(period) {
    const { startId, endId, todayId } = computeRange(period);
    const totals = blankTotals();
    let daysCovered = 0;

    const archiveSnap = await getDocs(query(collection(db, 'archives'), where('type', '==', 'overall')));
    let todayArchived = false;
    archiveSnap.forEach(docSnap => {
      const data = docSnap.data();
      if (!data.dateId || data.dateId < startId || data.dateId > endId) return;
      sumWardsMap(data.wards, totals);
      daysCovered += 1;
      if (data.dateId === todayId) todayArchived = true;
    });

    if (todayId >= startId && todayId <= endId && !todayArchived) {
      const wardsSnap = await getDocs(collection(db, 'nurseReports', todayId, 'wards'));
      const liveWardsMap = {};
      wardsSnap.forEach(d => { liveWardsMap[d.id] = d.data(); });
      if (Object.keys(liveWardsMap).length) {
        sumWardsMap(liveWardsMap, totals);
        daysCovered += 1;
      }
    }

    return { totals, startId, endId, daysCovered };
  }

  let barChart = null, sexPie = null, affiliationPie = null;

  function renderCharts(totals) {
    const barCtx = document.getElementById('barChart').getContext('2d');
    const barData = CLINICAL_FIELDS.map(f => totals[f.key]);
    if (barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: CLINICAL_FIELDS.map(f => f.label),
        datasets: [{
          data: barData,
          backgroundColor: ['#2563eb', '#dc2626', '#d97706', '#7c3aed', '#0891b2']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });

    const sexCtx = document.getElementById('sexPie').getContext('2d');
    if (sexPie) sexPie.destroy();
    sexPie = new Chart(sexCtx, {
      type: 'pie',
      data: {
        labels: ['Male', 'Female', 'Children'],
        datasets: [{ data: [totals.male, totals.female, totals.child], backgroundColor: ['#2563eb', '#db2777', '#f59e0b'] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
    });

    const affCtx = document.getElementById('affiliationPie').getContext('2d');
    if (affiliationPie) affiliationPie.destroy();
    affiliationPie = new Chart(affCtx, {
      type: 'pie',
      data: {
        labels: ['Soldiers', 'Civilians'],
        datasets: [{ data: [totals.soldier, totals.civilian], backgroundColor: ['#16a34a', '#6b7280'] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
    });
  }

  function renderSummary(totals) {
    const clinicalGrid = document.getElementById('clinicalGrid');
    clinicalGrid.innerHTML = '';
    CLINICAL_FIELDS.forEach(f => {
      const box = document.createElement('div');
      box.className = 'stat-box';
      box.innerHTML = '<div class="n">' + totals[f.key] + '</div><div class="l">' + f.label + '</div>';
      clinicalGrid.appendChild(box);
    });
    const demoGrid = document.getElementById('demoGrid');
    demoGrid.innerHTML = '';
    DEMOGRAPHIC_FIELDS.forEach(f => {
      const box = document.createElement('div');
      box.className = 'stat-box demo';
      box.innerHTML = '<div class="n">' + totals[f.key] + '</div><div class="l">' + f.label + '</div>';
      demoGrid.appendChild(box);
    });
  }

  let activePeriod = 'today';
  let loadToken = 0;

  async function loadAndRender(period) {
    activePeriod = period;
    document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.period === period));
    const myToken = ++loadToken;
    document.getElementById('loadingNote').style.display = 'block';
    document.getElementById('summaryCard').style.display = 'none';
    document.getElementById('chartsCard').style.display = 'none';
    document.getElementById('emptyCard').style.display = 'none';

    let result;
    try {
      result = await loadTotals(period);
    } catch (e) {
      document.getElementById('loadingNote').textContent = "Couldn't load: " + (e.code || e.message || 'unknown error');
      return;
    }
    if (myToken !== loadToken) return; // a newer period was picked while this was loading

    document.getElementById('loadingNote').style.display = 'none';
    const { totals, startId, endId, daysCovered } = result;
    document.getElementById('rangeLabel').textContent =
      (startId === endId ? fmtDate(startId) : fmtDate(startId) + ' \u2013 ' + fmtDate(endId)) +
      (daysCovered ? ' \u00b7 ' + daysCovered + ' day' + (daysCovered === 1 ? '' : 's') + ' of reports' : '');

    if (daysCovered === 0) {
      document.getElementById('emptyCard').style.display = 'block';
      return;
    }

    document.getElementById('summaryCard').style.display = 'block';
    document.getElementById('chartsCard').style.display = 'block';
    renderSummary(totals);
    renderCharts(totals);
  }

  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => loadAndRender(btn.dataset.period));
  });

  requireAuth(() => {
    loadAndRender('today');
  });
</script>
</body>
</html>
