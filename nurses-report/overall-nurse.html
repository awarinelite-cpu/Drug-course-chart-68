<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Overall Nurse</title>
<link rel="stylesheet" href="../js/styles.css">
<style>
  .period-label { font-size: 13px; font-weight: bold; color: #111827; }
  .who-label { font-size: 12px; color: #555; margin-top: 4px; }
  table.report th, table.report td { border: 1px solid #d1d5db; padding: 5px 4px; font-size: 12px; text-align: center; }
  table.report th { background: #f3f4f6; text-transform: uppercase; font-size: 10px; white-space: normal !important; }
  table.report td.ward-name { font-weight: bold; text-align: left; white-space: nowrap; }
  table.report input {
    width: 56px; padding: 4px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; text-align: center;
  }
  table.report input.duty-input { width: 100px; text-align: left; }
  table.report tr.totals-row td { font-weight: bold; background: #eff6ff; }
  .lock-btn {
    border: none; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap;
  }
  .lock-btn.locked { background: #fee2e2; color: #7f1d1d; }
  .lock-btn.open { background: #dcfce7; color: #14532d; }
  .save-status { font-size: 11px; color: #6b7280; min-height: 14px; }

  .ward-report-block { margin-top: 16px; }
  .ward-report-heading {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: 22px;
    text-transform: uppercase;
    color: #000;
    letter-spacing: .5px;
    margin: 0 0 10px 0;
  }
  table.ward-shift th, table.ward-shift td { border: 1px solid #d1d5db; padding: 5px 4px; font-size: 12px; text-align: center; }
  table.ward-shift th { background: #f3f4f6; text-transform: uppercase; font-size: 10px; }
  table.ward-shift td.shift-name { font-weight: bold; text-align: left; }
  table.ward-shift tr.total-row td { font-weight: bold; background: #eff6ff; }
  .patient-block { padding: 0; margin-top: 14px; position: relative; }
  .patient-block .patient-line { font-size: 13px; margin: 2px 0; }
  .patient-block h3 { display: inline; font-size: inherit; font-weight: bold; margin: 0; }
  .patient-block .patient-note-label { font-size: 12px; text-decoration: underline; margin-top: 8px; display: block; }
  .patient-block .patient-note-text { font-size: 13px; white-space: pre-wrap; margin: 4px 0 0 0; text-align: justify; }
  .patient-block .patient-note-subheading { font-size: 13px; font-weight: bold; margin: 8px 0 2px 0; }
  .status-stamp {
    position: absolute; top: 0; right: 0;
    color: #dc2626; font-weight: 900; font-size: 15px; text-transform: uppercase;
    letter-spacing: 1px; transform: rotate(-14deg); opacity: .85;
    font-family: Arial, Helvetica, sans-serif; pointer-events: none; white-space: nowrap;
  }
  .no-patients { font-size: 12px; color: #6b7280; }
  .night-update-block { padding: 0; margin-top: 4px; }
  .night-update-block .patient-note-label { font-size: 12px; text-decoration: underline; margin-top: 0; display: block; }
  .night-update-block .patient-note-text { font-size: 13px; white-space: pre-wrap; margin: 4px 0 0 0; text-align: justify; }
  .ward-report-empty { font-size: 13px; color: #6b7280; text-align: center; padding: 10px; }
  h1.period-label { margin: 0; }
  .card-box > h2 { margin: 0 0 4px 0; font-weight: bold; font-size: 17px; }
</style>
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<div class="topbar">
  <div class="brand">Overall Nurse</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('role-select.html')">Back</button>
    <button class="btn btn-primary" style="padding:6px 12px;" onclick="window.print()">Print</button>
  </div>
</div>

<div class="container">

  <div class="card-box" id="deniedBox" style="display:none; text-align:center;">
    <h3 style="margin-top:0;">Not the Overall Nurse</h3>
    <p style="font-size:13px; color:#555;" id="deniedMsg"></p>
    <button class="btn btn-primary" style="padding:8px 14px;" onclick="window.location.href='role-select.html'">Go to Role Selection</button>
  </div>

  <div id="reportBox" style="display:none;">
    <div class="card-box">
      <h1 class="period-label" id="periodLabel">Loading…</h1>
      <div class="who-label" id="whoLabel"></div>
    </div>

    <div class="card-box">
      <h2>All Wards — 24-Hour Statistics</h2>
      <div class="table-wrap">
        <table class="report" id="reportTable"></table>
      </div>
      <div class="save-status" id="saveStatus"></div>
    </div>

    <div class="card-box">
      <h2>Ward Reports</h2>
      <div id="wardReports"></div>
    </div>
  </div>

</div>

<script type="module">
  import { requireAuth } from "../js/auth-guard.js";
  import { db } from "../js/firebase.js";
  import {
    doc, getDoc, getDocs, setDoc, updateDoc, collection, onSnapshot, serverTimestamp, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { WARDS, STAT_FIELDS, SHIFT_STAT_FIELDS, SHIFTS, PATIENT_FIELDS, reportDateId, reportPeriodLabel, weekId, occDelta } from "../js/nurses-report-common.js";

  const wk = weekId();
  const dateId = reportDateId();
  const roleRef = doc(db, 'nurseReportRoles', wk);
  const wardsCol = collection(db, 'nurseReports', dateId, 'wards');

  document.getElementById('periodLabel').textContent = reportPeriodLabel(dateId);

  let currentUser = null, currentProfile = null;
  const wardData = {};       // wardKey -> latest known Firestore data
  const rowRefs = {};        // wardKey -> { inputs: {field: <input>}, dutyInput, lockBtn }
  const totalCells = {};     // field -> <td>

  function setSaveStatus(msg, isError) {
    const el = document.getElementById('saveStatus');
    el.textContent = msg;
    el.style.color = isError ? '#dc2626' : '#6b7280';
  }

  async function saveField(wardKey, field, value) {
    try {
      await updateDoc(doc(wardsCol, wardKey), {
        [field]: value, updatedAt: serverTimestamp(), updatedBy: currentProfile.name || 'Unknown'
      });
      setSaveStatus('Saved.', false);
    } catch (e) {
      setSaveStatus("Couldn't save: " + (e.code || e.message || 'unknown error'), true);
    }
  }

  async function toggleLock(wardKey) {
    const locked = !!(wardData[wardKey] && wardData[wardKey].locked);
    try {
      await updateDoc(doc(wardsCol, wardKey), { locked: !locked });
    } catch (e) {
      setSaveStatus("Couldn't change access: " + (e.code || e.message || 'unknown error'), true);
    }
  }

  function buildTable() {
    const table = document.getElementById('reportTable');
    const thead = document.createElement('thead');
    const row1 = document.createElement('tr');
    const row2 = document.createElement('tr');
    function rowspanTh(label, target) {
      const th = document.createElement('th');
      th.textContent = label;
      th.rowSpan = 2;
      target.appendChild(th);
    }
    function colspanTh(label, target) {
      const th = document.createElement('th');
      th.textContent = label;
      th.colSpan = 2;
      target.appendChild(th);
    }
    rowspanTh('Ward', row1);
    STAT_FIELDS.forEach(f => {
      if (f.key === 'transferIn') { colspanTh('Int. Transfer', row1); return; }
      if (f.key === 'transferOut') return; // covered by the Int. Transfer colspan above
      if (f.key === 'ext') { colspanTh('Ext. Transfer', row1); return; }
      if (f.key === 'extOut') return; // covered by the Ext. Transfer colspan above
      rowspanTh(f.label, row1);
    });
    rowspanTh('Nurses on Duty', row1);
    rowspanTh('Access', row1);
    ['In', 'Out', 'In', 'Out'].forEach(label => {
      const th = document.createElement('th');
      th.textContent = label;
      row2.appendChild(th);
    });
    thead.appendChild(row1);
    thead.appendChild(row2);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    WARDS.forEach(w => {
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.className = 'ward-name';
      nameTd.textContent = w.label;
      tr.appendChild(nameTd);

      const inputs = {};
      STAT_FIELDS.forEach(f => {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.value = f.key === 'beds' ? w.beds : 0;
        input.addEventListener('change', () => {
          const num = parseFloat(input.value);
          const val = isNaN(num) ? 0 : num;
          input.value = val;
          wardData[w.key] = wardData[w.key] || {};
          wardData[w.key][f.key] = val;
          recomputeTotals();
          saveField(w.key, f.key, val);
        });
        td.appendChild(input);
        tr.appendChild(td);
        inputs[f.key] = input;
      });

      const dutyTd = document.createElement('td');
      const dutyInput = document.createElement('input');
      dutyInput.type = 'text';
      dutyInput.className = 'duty-input';
      dutyInput.placeholder = 'Nurse name';
      dutyInput.addEventListener('change', () => {
        wardData[w.key] = wardData[w.key] || {};
        wardData[w.key].nurseOnDuty = dutyInput.value;
        saveField(w.key, 'nurseOnDuty', dutyInput.value);
      });
      dutyTd.appendChild(dutyInput);
      tr.appendChild(dutyTd);

      const accessTd = document.createElement('td');
      const lockBtn = document.createElement('button');
      lockBtn.className = 'lock-btn locked';
      lockBtn.textContent = '🔒 Locked';
      lockBtn.addEventListener('click', () => toggleLock(w.key));
      accessTd.appendChild(lockBtn);
      tr.appendChild(accessTd);

      tbody.appendChild(tr);
      rowRefs[w.key] = { inputs, dutyInput, lockBtn };
    });
    table.appendChild(tbody);

    const totalsTr = document.createElement('tr');
    totalsTr.className = 'totals-row';
    const totalsLabelTd = document.createElement('td');
    totalsLabelTd.className = 'ward-name';
    totalsLabelTd.textContent = 'TOTAL';
    totalsTr.appendChild(totalsLabelTd);
    STAT_FIELDS.forEach(f => {
      const td = document.createElement('td');
      td.textContent = '0';
      totalsTr.appendChild(td);
      totalCells[f.key] = td;
    });
    totalsTr.appendChild(document.createElement('td'));
    totalsTr.appendChild(document.createElement('td'));
    tbody.appendChild(totalsTr);
  }

  function recomputeTotals() {
    STAT_FIELDS.forEach(f => {
      let sum = 0;
      WARDS.forEach(w => {
        const v = wardData[w.key] ? wardData[w.key][f.key] : undefined;
        sum += typeof v === 'number' ? v : 0;
      });
      totalCells[f.key].textContent = sum;
    });
  }

  // Applies a remote data update to the row's inputs, but never overwrites a
  // field the nurse is actively typing into — otherwise a live sync update
  // from another device could yank the cursor mid-entry.
  function applyWardData(wardKey, data) {
    wardData[wardKey] = data;
    const refs = rowRefs[wardKey];
    if (!refs) return;
    STAT_FIELDS.forEach(f => {
      const input = refs.inputs[f.key];
      if (document.activeElement !== input) input.value = (typeof data[f.key] === 'number') ? data[f.key] : 0;
    });
    if (document.activeElement !== refs.dutyInput) refs.dutyInput.value = data.nurseOnDuty || '';
    const locked = !!data.locked;
    refs.lockBtn.className = 'lock-btn ' + (locked ? 'locked' : 'open');
    refs.lockBtn.textContent = locked ? '🔒 Locked' : '🔓 Open';
    recomputeTotals();
    renderWardReports();
  }

  const movementFields = SHIFT_STAT_FIELDS;

  function buildWardShiftTable(w, data) {
    const shifts = data.shifts || {};
    const byKey = k => movementFields.find(f => f.key === k);
    const soloBefore = ['adm', 'disch', 'dama'].map(byKey);
    const soloAfter = ['sc', 'vsc', 'absc', 'bid', 'death'].map(byKey);
    const transferPair = [byKey('transferIn'), byKey('transferOut')];
    const extPair = [byKey('ext'), byKey('extOut')];

    const beds = typeof data.beds === 'number' ? data.beds : (w.beds || 0);
    const startOcc = typeof data.startOcc === 'number' ? data.startOcc : 0;
    let runningOcc = startOcc;
    const perShiftOcc = {};
    SHIFTS.forEach(s => {
      runningOcc += occDelta(shifts[s.key] || {});
      if (runningOcc < 0) runningOcc = 0;
      perShiftOcc[s.key] = runningOcc;
    });
    const finalOcc = typeof data.occ === 'number' ? data.occ : runningOcc;

    const table = document.createElement('table');
    table.className = 'ward-shift';

    const thead = document.createElement('thead');
    const row1 = document.createElement('tr');
    const row2 = document.createElement('tr');
    function rowspanTh(label, target) {
      const th = document.createElement('th');
      th.textContent = label;
      th.rowSpan = 2;
      target.appendChild(th);
    }
    function colspanTh(label, target) {
      const th = document.createElement('th');
      th.textContent = label;
      th.colSpan = 2;
      target.appendChild(th);
    }
    rowspanTh('Shift', row1);
    rowspanTh('Beds', row1);
    rowspanTh('Occ', row1);
    rowspanTh('Vac', row1);
    soloBefore.forEach(f => rowspanTh(f.label, row1));
    colspanTh('Int. Transfer', row1);
    colspanTh('Ext. Transfer', row1);
    soloAfter.forEach(f => rowspanTh(f.label, row1));
    rowspanTh('Nurses on Duty', row1);
    ['In', 'Out', 'In', 'Out'].forEach(label => {
      const th = document.createElement('th');
      th.textContent = label;
      row2.appendChild(th);
    });
    thead.appendChild(row1);
    thead.appendChild(row2);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    SHIFTS.forEach(s => {
      const sData = shifts[s.key] || {};
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.className = 'shift-name';
      nameTd.textContent = s.label;
      tr.appendChild(nameTd);

      const bedsTd = document.createElement('td');
      bedsTd.textContent = beds;
      tr.appendChild(bedsTd);

      const occTd = document.createElement('td');
      occTd.textContent = perShiftOcc[s.key];
      tr.appendChild(occTd);

      const vacTd = document.createElement('td');
      vacTd.textContent = beds - perShiftOcc[s.key];
      tr.appendChild(vacTd);

      [...soloBefore, ...transferPair, ...extPair, ...soloAfter].forEach(f => {
        const td = document.createElement('td');
        td.textContent = typeof sData[f.key] === 'number' ? sData[f.key] : 0;
        tr.appendChild(td);
      });

      const dutyTd = document.createElement('td');
      dutyTd.style.textAlign = 'left';
      dutyTd.textContent = sData.nurseOnDuty || '\u2014';
      tr.appendChild(dutyTd);

      tbody.appendChild(tr);
    });

    // Total row: Beds/Occ/Vac carry the Pm (final) figures forward — never
    // summed. Movement columns sum Am+Pm. Nurses on Duty carries Pm forward.
    const totalTr = document.createElement('tr');
    totalTr.className = 'total-row';
    const totalNameTd = document.createElement('td');
    totalNameTd.className = 'shift-name';
    totalNameTd.textContent = 'Total';
    totalTr.appendChild(totalNameTd);

    const totalBedsTd = document.createElement('td');
    totalBedsTd.textContent = beds;
    totalTr.appendChild(totalBedsTd);

    const totalOccTd = document.createElement('td');
    totalOccTd.textContent = finalOcc;
    totalTr.appendChild(totalOccTd);

    const totalVacTd = document.createElement('td');
    totalVacTd.textContent = beds - finalOcc;
    totalTr.appendChild(totalVacTd);

    [...soloBefore, ...transferPair, ...extPair, ...soloAfter].forEach(f => {
      const td = document.createElement('td');
      td.textContent = typeof data[f.key] === 'number' ? data[f.key] : 0;
      totalTr.appendChild(td);
    });

    const dutyTotalTd = document.createElement('td');
    dutyTotalTd.style.textAlign = 'left';
    const pmDuty = (shifts.pm || {}).nurseOnDuty;
    dutyTotalTd.textContent = pmDuty || '\u2014';
    totalTr.appendChild(dutyTotalTd);

    tbody.appendChild(totalTr);
    table.appendChild(tbody);
    return table;
  }

  function isNoteHeadingLine(line) {
    const t = line.trim();
    if (!t || t.length > 60) return false;
    const letters = t.replace(/[^A-Za-z]/g, '');
    return letters.length > 0 && letters === letters.toUpperCase();
  }
  function renderNoteLines(container, text) {
    const lines = String(text).split('\n');
    let paraLines = [];
    function flushPara() {
      if (!paraLines.length) return;
      const p = document.createElement('p');
      p.className = 'patient-note-text';
      p.textContent = paraLines.join('\n');
      container.appendChild(p);
      paraLines = [];
    }
    lines.forEach(line => {
      if (isNoteHeadingLine(line)) {
        flushPara();
        const h = document.createElement('h4');
        h.className = 'patient-note-subheading';
        h.textContent = line.trim();
        container.appendChild(h);
      } else {
        paraLines.push(line);
      }
    });
    flushPara();
  }

  function buildPatientBlock(p) {
    const block = document.createElement('div');
    block.className = 'patient-block';

    if (p.status) {
      const stamp = document.createElement('div');
      stamp.className = 'status-stamp';
      stamp.textContent = p.status;
      block.appendChild(stamp);
    }

    const summaryFields = PATIENT_FIELDS.filter(f => f.type !== 'textarea');
    summaryFields.forEach(f => {
      if (!p[f.key]) return;
      const line = document.createElement('div');
      line.className = 'patient-line';
      const b = document.createElement('h3');
      b.textContent = f.label + ': ';
      line.appendChild(b);
      line.appendChild(document.createTextNode(p[f.key]));
      block.appendChild(line);
    });

    const textFields = PATIENT_FIELDS.filter(f => f.type === 'textarea');
    textFields.forEach(f => {
      if (!p[f.key]) return;
      const label = document.createElement('h3');
      label.className = 'patient-note-label';
      label.textContent = f.label + ':';
      block.appendChild(label);
      renderNoteLines(block, p[f.key]);
    });

    return block;
  }

  function renderWardReports() {
    const container = document.getElementById('wardReports');
    container.innerHTML = '';
    const submittedWards = WARDS.filter(w => wardData[w.key] && wardData[w.key].submitted);

    if (submittedWards.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'ward-report-empty';
      empty.textContent = 'No ward reports submitted yet.';
      container.appendChild(empty);
      return;
    }

    submittedWards.forEach(w => {
      const data = wardData[w.key];
      const block = document.createElement('div');
      block.className = 'ward-report-block';

      const heading = document.createElement('h2');
      heading.className = 'ward-report-heading';
      heading.textContent = w.label;
      block.appendChild(heading);

      const shiftWrap = document.createElement('div');
      shiftWrap.className = 'table-wrap';
      shiftWrap.appendChild(buildWardShiftTable(w, data));
      block.appendChild(shiftWrap);

      const patients = Array.isArray(data.patients) ? data.patients : [];
      if (patients.length === 0) {
        const none = document.createElement('div');
        none.className = 'no-patients';
        none.style.marginTop = '10px';
        none.textContent = 'No patient write-ups submitted for this ward.';
        block.appendChild(none);
      } else {
        patients.forEach(p => block.appendChild(buildPatientBlock(p)));
      }

      // Night update continues directly beneath the morning write-up, on the
      // same plain sheet, rather than as a separate boxed section.
      if (data.nightUpdate) {
        const nu = document.createElement('div');
        nu.className = 'night-update-block';
        const label = document.createElement('h3');
        label.className = 'patient-note-label';
        label.textContent = 'Night Update' + (data.nightUpdateBy ? ' — ' + data.nightUpdateBy : '') + ':';
        nu.appendChild(label);
        const text = document.createElement('p');
        text.className = 'patient-note-text';
        text.textContent = data.nightUpdate;
        nu.appendChild(text);
        block.appendChild(nu);
      }

      container.appendChild(block);
    });
  }

  async function ensureSeeded() {
    let snap;
    try {
      snap = await getDocs(wardsCol);
    } catch (e) {
      setSaveStatus("Couldn't load ward data: " + (e.code || e.message || 'unknown error'), true);
      return;
    }
    const existing = new Set(snap.docs.map(d => d.id));
    const missing = WARDS.filter(w => !existing.has(w.key));
    if (missing.length === 0) return;
    const batch = writeBatch(db);
    missing.forEach(w => {
      const data = { label: w.label, beds: w.beds, nurseOnDuty: '', locked: false };
      STAT_FIELDS.forEach(f => { if (f.key !== 'beds') data[f.key] = 0; });
      batch.set(doc(wardsCol, w.key), data);
    });
    try {
      await batch.commit();
    } catch (e) {
      setSaveStatus("Couldn't seed ward list: " + (e.code || e.message || 'unknown error'), true);
    }
  }

  function subscribeToWards() {
    onSnapshot(wardsCol, snap => {
      snap.docChanges().forEach(change => {
        if (change.type === 'removed') return;
        applyWardData(change.doc.id, change.doc.data());
      });
    }, err => {
      setSaveStatus("Live sync error: " + (err.code || err.message || 'unknown error'), true);
    });
  }

  requireAuth(async (user, profile) => {
    currentUser = user;
    currentProfile = profile;

    let roleSnap;
    try {
      roleSnap = await getDoc(roleRef);
    } catch (e) {
      document.getElementById('deniedMsg').textContent = "Couldn't check the current Overall Nurse: " + (e.code || e.message || 'unknown error');
      document.getElementById('deniedBox').style.display = 'block';
      return;
    }
    const overall = roleSnap.exists() ? roleSnap.data().overallNurse : null;
    const isAdmin = profile.role === 'admin';
    const isOverall = overall && overall.uid === user.uid;

    if (!isAdmin && !isOverall) {
      document.getElementById('deniedMsg').textContent = overall
        ? (overall.name || 'Another nurse') + ' is the Overall Nurse for this week. Ask them to hand off the role, or claim it yourself if it\u2019s free next week.'
        : "No one has assumed the Overall Nurse role this week yet.";
      document.getElementById('deniedBox').style.display = 'block';
      return;
    }

    document.getElementById('whoLabel').textContent = 'Overall Nurse this week: ' + (overall ? overall.name : profile.name) + (isAdmin && !isOverall ? ' (viewing as admin)' : '');
    document.getElementById('reportBox').style.display = 'block';

    buildTable();
    await ensureSeeded();
    subscribeToWards();
  });
</script>
</body>
</html>
