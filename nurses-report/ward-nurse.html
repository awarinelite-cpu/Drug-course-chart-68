<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Ward Nurse</title>
<link rel="stylesheet" href="../js/styles.css">
<style>
  .ward-select-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ward-select-row select { flex: 1; min-width: 160px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .status-pill { font-size: 11px; font-weight: bold; padding: 3px 9px; border-radius: 999px; }
  .status-pill.submitted { background: #dcfce7; color: #14532d; }
  .status-pill.draft { background: #fef3c7; color: #78350f; }
  .status-pill.locked { background: #fee2e2; color: #7f1d1d; }
  table.shift th, table.shift td { border: 1px solid #d1d5db; padding: 5px 4px; font-size: 12px; text-align: center; }
  table.shift th { background: #f3f4f6; text-transform: uppercase; font-size: 10px; }
  table.shift td.shift-name { font-weight: bold; text-align: left; }
  table.shift tr.total-row td { font-weight: bold; background: #eff6ff; }
  table.shift input { width: 52px; padding: 4px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; text-align: center; }
  table.shift input.duty-input { width: 130px; text-align: left; }
  table.shift td.computed { background: #f9fafb; font-weight: bold; color: #1d4ed8; }
  table.shift td.mirrored { background: #f9fafb; color: #374151; }
  .patient-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-top: 12px; position: relative; }
  .patient-card .remove-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #7f1d1d; border: none; border-radius: 6px; padding: 4px 9px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .patient-field { margin-top: 8px; }
  .patient-field label { display: block; font-size: 14px; color: #111; margin-bottom: 4px; font-weight: bold; }
  .patient-field input, .patient-field textarea { width: 100%; padding: 7px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box; font-family: inherit; }
  .patient-field textarea { min-height: 60px; resize: vertical; }
  .patient-field textarea.big { min-height: 60vh; font-size: 15px; line-height: 1.4; }
  .patient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .add-patient-btn { margin-top: 12px; width: 100%; padding: 10px; border: 2px dashed #93c5fd; background: #eff6ff; color: #1d4ed8; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
  .submit-bar { display: flex; gap: 10px; margin-top: 14px; }
  .save-status { font-size: 11px; color: #6b7280; min-height: 14px; margin-top: 6px; }
  .locked-notice { background: #fef3c7; color: #78350f; border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-top: 10px; }
  .brand { font-weight: bold; }
  .card-box > h2 { margin-top: 0; font-weight: bold; font-size: 19px; }
  .card-box > p { font-size: 12px; color: #555; margin-top: -6px; }
  .patient-block { padding: 0; margin-top: 14px; }
  .night-update-heading { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5e7eb; }
  .patient-block .patient-line { font-size: 13px; margin: 2px 0; }
  .patient-block .patient-line b { font-weight: bold; }
  .patient-block .patient-note-label { font-size: 12px; font-weight: bold; text-decoration: underline; margin-top: 8px; display: block; }
  .patient-block .patient-note-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; margin: 4px 0 0 0; }
  .no-patients { font-size: 12px; color: #6b7280; }
  .admin-edit-btn { border: none; background: #eff6ff; color: #1d4ed8; border-radius: 6px; padding: 2px 8px; font-size: 13px; cursor: pointer; margin-left: 8px; }
  .patient-block h3, .patient-line h3 { display: inline; font-size: inherit; font-weight: bold; margin: 0; }
  .patient-block .patient-note-label { display: block; margin-top: 8px; }
  .patient-block .patient-note-text { text-align: justify; }
  .patient-block .patient-note-subheading { font-size: 14px; font-weight: bold; margin: 8px 0 2px 0; }
  .patient-block { position: relative; }
  .status-select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 999px; font-size: 12px; font-weight: bold; background: #fff; }
  .status-select.set { background: #fee2e2; color: #7f1d1d; border-color: #fca5a5; }
  .status-stamp {
    position: absolute; top: 10px; right: 14px;
    color: #dc2626; font-weight: 900; font-size: 15px; text-transform: uppercase;
    letter-spacing: 1px; transform: rotate(-14deg); opacity: .85;
    font-family: Arial, Helvetica, sans-serif; pointer-events: none; white-space: nowrap;
  }
  .night-update-meta { font-size: 11px; color: #6b7280; margin-top: 6px; min-height: 14px; }
  #nightUpdateWrap { padding: 0; }
  #nightUpdateWrap label.patient-note-label { margin-top: 0; }
  #nightUpdateInput {
    border: none; border-radius: 0; padding: 0; background: transparent; box-shadow: none;
    font-size: 14px; line-height: 1.5; text-align: justify; font-family: inherit; resize: vertical;
  }
</style>
</head>
<body>
<script type="module" src="../js/nav.js"></script>
<div class="topbar">
  <div class="brand">Ward Nurse</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('role-select.html')">Back</button>
  </div>
</div>

<div class="container">

  <div class="card-box">
    <div class="ward-select-row">
      <select id="wardSelect">
        <option value="">-- Select your ward --</option>
      </select>
      <span class="status-pill" id="statusPill" style="display:none;"></span>
      <button class="btn btn-secondary" id="wardArchiveBtn" style="padding:6px 12px; display:none;" type="button">📁 Archive</button>
    </div>
    <div class="save-status" id="topStatus"></div>
  </div>

  <div id="formBox" style="display:none;">

    <div class="locked-notice" id="lockedNotice" style="display:none;"></div>

    <div class="card-box">
      <h2>Previous Occ</h2>
      <div class="patient-field" style="max-width:140px;">
        <input type="number" id="startOccInput" inputmode="numeric">
      </div>
    </div>

    <div class="card-box">
      <h2>Shift Statistics</h2>
      <div class="table-wrap">
        <table class="shift" id="shiftTable"></table>
      </div>
    </div>

    <div class="card-box report-sheet">
      <h2>Patients</h2>
      <div id="patientList"></div>
      <button class="add-patient-btn" id="addPatientBtn" type="button">+ Add Patient</button>

      <h2 class="night-update-heading">Night Update</h2>
      <button class="btn btn-secondary" id="nightUpdateBtn" type="button">🌙 Night Update</button>
      <div class="patient-field" id="nightUpdateWrap" style="display:none; margin-top:10px;">
        <label class="patient-note-label" style="margin-top:0;">Night update:</label>
        <textarea id="nightUpdateInput" placeholder="Type the night update here…" style="min-height:140px;"></textarea>
      </div>
      <div class="night-update-meta" id="nightUpdateMeta"></div>
    </div>

    <div class="card-box">
      <div class="submit-bar">
        <button class="btn btn-secondary" id="saveBtn" style="flex:1; padding:12px;">Save</button>
        <button class="btn btn-primary" id="submitBtn" style="flex:1; padding:12px; display:none;">Submit Report</button>
      </div>
      <div class="save-status" id="saveStatus"></div>
    </div>

  </div>

</div>

<script type="module">
  import { requireAuth } from "../js/auth-guard.js";
  import { db } from "../js/firebase.js";
  import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { WARDS, STAT_FIELDS, SHIFT_STAT_FIELDS, SHIFTS, PATIENT_FIELDS, PATIENT_STATUS_OPTIONS, reportDateId, occDelta, blankShift, defaultWardDoc } from "../js/nurses-report-common.js";

  const dateId = reportDateId();
  const movementFields = SHIFT_STAT_FIELDS;

  let currentUser = null, currentProfile = null, currentWardKey = null;
  let wardDoc = null; // latest loaded/edited state (in-memory, saved as a whole on submit)
  let editable = false;
  let adminEditOverride = false; // admin tapped the ✏️ to leave read-only view for a locked report
  const shiftInputs = {};   // shiftKey -> { field: input, duty: input }
  const totalCells = {};    // field -> td
  const bedsCells = {};     // shiftKey/'total' -> td (Am holds the real input; Pm/Total mirror it)
  const occCells = {};      // shiftKey/'total' -> td
  const vacCells = {};      // shiftKey/'total' -> td
  let bedsInput = null;
  let dutyTotalCell = null; // the Total row's "Nurses on Duty" cell (mirrors the Pm entry)
  let patientCounter = 0;

  const wardSelect = document.getElementById('wardSelect');
  WARDS.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w.key;
    opt.textContent = w.label;
    wardSelect.appendChild(opt);
  });

  function setSaveStatus(msg, isError) {
    const el = document.getElementById('saveStatus');
    el.textContent = msg;
    el.style.color = isError ? '#dc2626' : '#6b7280';
  }
  function setTopStatus(msg, isError) {
    const el = document.getElementById('topStatus');
    el.textContent = msg;
    el.style.color = isError ? '#dc2626' : '#6b7280';
  }

  function buildShiftTable() {
    const table = document.getElementById('shiftTable');
    table.innerHTML = '';
    const byKey = k => movementFields.find(f => f.key === k);
    const soloBefore = ['adm', 'disch', 'dama'].map(byKey);
    const soloAfter = ['sc', 'vsc', 'absc', 'bid', 'death'].map(byKey);
    const transferPair = [byKey('transferIn'), byKey('transferOut')];
    const extPair = [byKey('ext'), byKey('extOut')];

    const thead = document.createElement('thead');
    const row1 = document.createElement('tr');
    const row2 = document.createElement('tr');

    function rowspanTh(label, target) {
      const th = document.createElement('th');
      th.textContent = label;
      th.rowSpan = 2;
      target.appendChild(th);
    }
    function colspanTh(label, target) {
      const th = document.createElement('th');
      th.textContent = label;
      th.colSpan = 2;
      target.appendChild(th);
    }

    rowspanTh('Shift', row1);
    rowspanTh('Beds', row1);
    rowspanTh('Occ', row1);
    rowspanTh('Vac', row1);
    soloBefore.forEach(f => rowspanTh(f.label, row1));
    colspanTh('Int. Transfer', row1);
    colspanTh('Ext. Transfer', row1);
    soloAfter.forEach(f => rowspanTh(f.label, row1));
    rowspanTh('Nurses on Duty', row1);

    ['In', 'Out', 'In', 'Out'].forEach(label => {
      const th = document.createElement('th');
      th.textContent = label;
      row2.appendChild(th);
    });

    thead.appendChild(row1);
    thead.appendChild(row2);
    table.appendChild(thead);

    function movementInput(tr, s, f) {
      const td = document.createElement('td');
      const input = document.createElement('input');
      input.type = 'number';
      input.inputMode = 'numeric';
      input.disabled = !editable;
      input.addEventListener('input', () => {
        const num = parseFloat(input.value);
        wardDoc.shifts[s.key][f.key] = isNaN(num) ? 0 : num;
        recomputeTotals();
      });
      td.appendChild(input);
      tr.appendChild(td);
      return input;
    }

    const tbody = document.createElement('tbody');
    SHIFTS.forEach(s => {
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.className = 'shift-name';
      nameTd.textContent = s.label;
      tr.appendChild(nameTd);

      // Beds: real editable input on Am, read-only mirror on Pm
      const bedsTd = document.createElement('td');
      if (s.key === 'am') {
        bedsInput = document.createElement('input');
        bedsInput.type = 'number';
        bedsInput.inputMode = 'numeric';
        bedsInput.disabled = !editable;
        bedsInput.addEventListener('input', () => {
          const num = parseFloat(bedsInput.value);
          wardDoc.beds = isNaN(num) ? 0 : num;
          recomputeCensus();
        });
        bedsTd.appendChild(bedsInput);
      } else {
        bedsTd.className = 'mirrored';
        bedsTd.textContent = '0';
      }
      tr.appendChild(bedsTd);
      bedsCells[s.key] = bedsTd;

      const occTd = document.createElement('td');
      occTd.className = 'computed';
      occTd.textContent = '0';
      tr.appendChild(occTd);
      occCells[s.key] = occTd;

      const vacTd = document.createElement('td');
      vacTd.className = 'computed';
      vacTd.textContent = '0';
      tr.appendChild(vacTd);
      vacCells[s.key] = vacTd;

      const fieldInputs = {};
      soloBefore.forEach(f => { fieldInputs[f.key] = movementInput(tr, s, f); });
      transferPair.forEach(f => { fieldInputs[f.key] = movementInput(tr, s, f); });
      extPair.forEach(f => { fieldInputs[f.key] = movementInput(tr, s, f); });
      soloAfter.forEach(f => { fieldInputs[f.key] = movementInput(tr, s, f); });

      const dutyTd = document.createElement('td');
      const dutyInput = document.createElement('input');
      dutyInput.type = 'text';
      dutyInput.className = 'duty-input';
      dutyInput.placeholder = 'Nurse name(s)';
      dutyInput.disabled = !editable;
      dutyInput.addEventListener('input', () => {
        wardDoc.shifts[s.key].nurseOnDuty = dutyInput.value;
        if (s.key === 'pm') dutyTotalCell.textContent = dutyInput.value || '\u2014';
      });
      dutyTd.appendChild(dutyInput);
      tr.appendChild(dutyTd);

      tbody.appendChild(tr);
      shiftInputs[s.key] = { fields: fieldInputs, duty: dutyInput };
    });

    // Total row: Beds/Occ/Vac mirror the Pm (final) figures — never summed.
    // Movement columns sum Am+Pm. Nurses on Duty carries Pm's entry forward.
    const totalTr = document.createElement('tr');
    totalTr.className = 'total-row';
    const totalNameTd = document.createElement('td');
    totalNameTd.className = 'shift-name';
    totalNameTd.textContent = 'Total';
    totalTr.appendChild(totalNameTd);

    const totalBedsTd = document.createElement('td');
    totalTr.appendChild(totalBedsTd);
    bedsCells.total = totalBedsTd;

    const totalOccTd = document.createElement('td');
    totalTr.appendChild(totalOccTd);
    occCells.total = totalOccTd;

    const totalVacTd = document.createElement('td');
    totalTr.appendChild(totalVacTd);
    vacCells.total = totalVacTd;

    movementFields.forEach(f => {
      const td = document.createElement('td');
      td.textContent = '0';
      totalTr.appendChild(td);
      totalCells[f.key] = td;
    });

    const dutyTotalTd = document.createElement('td');
    dutyTotalTd.style.textAlign = 'left';
    dutyTotalTd.textContent = '\u2014';
    totalTr.appendChild(dutyTotalTd);
    dutyTotalCell = dutyTotalTd;

    tbody.appendChild(totalTr);
    table.appendChild(tbody);
  }

  function recomputeTotals() {
    movementFields.forEach(f => {
      let sum = 0;
      SHIFTS.forEach(s => {
        const v = wardDoc.shifts[s.key][f.key];
        sum += typeof v === 'number' ? v : 0;
      });
      totalCells[f.key].textContent = sum;
      wardDoc[f.key] = sum; // top-level total, read by the Overall Nurse table
    });
    recomputeCensus();
  }

  function recomputeCensus() {
    const beds = typeof wardDoc.beds === 'number' ? wardDoc.beds : 0;
    const start = typeof wardDoc.startOcc === 'number' ? wardDoc.startOcc : 0;
    let occ = start;
    const perShiftOcc = {};
    SHIFTS.forEach(s => {
      occ += occDelta(wardDoc.shifts[s.key] || {});
      if (occ < 0) occ = 0;
      perShiftOcc[s.key] = occ;
    });
    wardDoc.occ = occ;   // Total Occ = the final (Pm) shift's figure, not a sum
    wardDoc.vac = beds - occ;

    SHIFTS.forEach(s => {
      if (occCells[s.key]) occCells[s.key].textContent = perShiftOcc[s.key];
      if (vacCells[s.key]) vacCells[s.key].textContent = beds - perShiftOcc[s.key];
    });
    if (occCells.total) occCells.total.textContent = occ;
    if (vacCells.total) vacCells.total.textContent = beds - occ;
    if (bedsCells.pm) bedsCells.pm.textContent = beds;
    if (bedsCells.total) bedsCells.total.textContent = beds;
  }

  function fillShiftInputsFromDoc() {
    SHIFTS.forEach(s => {
      const data = wardDoc.shifts[s.key] || blankShift();
      const refs = shiftInputs[s.key];
      movementFields.forEach(f => { refs.fields[f.key].value = typeof data[f.key] === 'number' ? data[f.key] : 0; });
      refs.duty.value = data.nurseOnDuty || '';
    });
    if (bedsInput) bedsInput.value = typeof wardDoc.beds === 'number' ? wardDoc.beds : 0;
    recomputeTotals();
  }

  function patientCardHtml(id) {
    const card = document.createElement('div');
    card.className = 'patient-card';
    card.dataset.id = id;

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.disabled = !editable;
    removeBtn.addEventListener('click', () => {
      wardDoc.patients = wardDoc.patients.filter(p => p.id !== id);
      card.remove();
    });
    card.appendChild(removeBtn);

    const statusWrap = document.createElement('div');
    statusWrap.className = 'patient-field';
    const statusLabel = document.createElement('label');
    statusLabel.textContent = 'Status:';
    statusWrap.appendChild(statusLabel);
    const statusSelect = document.createElement('select');
    statusSelect.className = 'status-select';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '— Select status —';
    statusSelect.appendChild(noneOpt);
    PATIENT_STATUS_OPTIONS.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      statusSelect.appendChild(o);
    });
    statusSelect.disabled = !editable;
    statusSelect.addEventListener('change', () => {
      const p = wardDoc.patients.find(p => p.id === id);
      if (p) p.status = statusSelect.value;
      statusSelect.classList.toggle('set', !!statusSelect.value);
    });
    statusWrap.appendChild(statusSelect);
    card.appendChild(statusWrap);
    card['input_status'] = statusSelect;

    const grid = document.createElement('div');
    grid.className = 'patient-grid';
    PATIENT_FIELDS.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'patient-field';
      if (f.type === 'textarea') wrap.style.gridColumn = '1 / -1';
      const label = document.createElement('label');
      label.textContent = f.label + ':';
      wrap.appendChild(label);
      const input = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
      if (f.type !== 'textarea') input.type = 'text';
      if (f.big) input.className = 'big';
      input.disabled = !editable;
      input.addEventListener('input', () => {
        const p = wardDoc.patients.find(p => p.id === id);
        if (p) p[f.key] = input.value;
      });
      wrap.appendChild(input);
      grid.appendChild(wrap);
      card.dataset['input_' + f.key] = '';
      card['input_' + f.key] = input;
    });
    card.appendChild(grid);
    return card;
  }

  // Read-only view: patient identifying details + the diagnosis/notes
  // write-up shown together as one flowing note (not boxed form fields),
  // matching how the Overall Nurse's summary already reads.
  // A nurse's free-text write-up often has its own section headers inside
  // it (LEFT UPPER LIMB FRACTURE / NURSING DIAGNOSIS / NURSING OBJECTIVE /
  // etc, by convention typed in ALL CAPS on their own line). Detect those
  // lines and render them as bold sub-headings within the note, splitting
  // the surrounding text into justified paragraphs around them — still one
  // continuous note, just with its internal structure visible.
  function isNoteHeadingLine(line) {
    const t = line.trim();
    if (!t || t.length > 60) return false;
    const letters = t.replace(/[^A-Za-z]/g, '');
    return letters.length > 0 && letters === letters.toUpperCase();
  }
  function renderNoteLines(container, text) {
    const lines = String(text).split('\n');
    let paraLines = [];
    function flushPara() {
      if (!paraLines.length) return;
      const p = document.createElement('p');
      p.className = 'patient-note-text';
      p.textContent = paraLines.join('\n');
      container.appendChild(p);
      paraLines = [];
    }
    lines.forEach(line => {
      if (isNoteHeadingLine(line)) {
        flushPara();
        const h = document.createElement('h4');
        h.className = 'patient-note-subheading';
        h.textContent = line.trim();
        container.appendChild(h);
      } else {
        paraLines.push(line);
      }
    });
    flushPara();
  }

  function buildPatientBlock(p) {
    const block = document.createElement('div');
    block.className = 'patient-block';

    if (p.status) {
      const stamp = document.createElement('div');
      stamp.className = 'status-stamp';
      stamp.textContent = p.status;
      block.appendChild(stamp);
    }

    const summaryFields = PATIENT_FIELDS.filter(f => f.type !== 'textarea');
    summaryFields.forEach(f => {
      if (!p[f.key]) return;
      const line = document.createElement('div');
      line.className = 'patient-line';
      const b = document.createElement('h3');
      b.textContent = f.label + ': ';
      line.appendChild(b);
      line.appendChild(document.createTextNode(p[f.key]));
      block.appendChild(line);
    });

    const textFields = PATIENT_FIELDS.filter(f => f.type === 'textarea');
    textFields.forEach(f => {
      if (!p[f.key]) return;
      const label = document.createElement('h3');
      label.className = 'patient-note-label';
      label.textContent = f.label + ':';
      block.appendChild(label);
      renderNoteLines(block, p[f.key]);
    });

    return block;
  }

  function renderPatients() {
    const list = document.getElementById('patientList');
    list.innerHTML = '';
    if (editable) {
      wardDoc.patients.forEach(p => {
        const card = patientCardHtml(p.id);
        PATIENT_FIELDS.forEach(f => { card['input_' + f.key].value = p[f.key] || ''; });
        card['input_status'].value = p.status || '';
        card['input_status'].classList.toggle('set', !!p.status);
        list.appendChild(card);
      });
    } else if (wardDoc.patients.length === 0) {
      const none = document.createElement('div');
      none.className = 'no-patients';
      none.textContent = 'No patient write-ups on this report.';
      list.appendChild(none);
    } else {
      wardDoc.patients.forEach(p => { list.appendChild(buildPatientBlock(p)); });
    }
  }

  function addPatient() {
    patientCounter += 1;
    const id = 'p' + Date.now() + '_' + patientCounter;
    const blank = { id, status: '' };
    PATIENT_FIELDS.forEach(f => { blank[f.key] = ''; });
    wardDoc.patients.push(blank);
    const card = patientCardHtml(id);
    document.getElementById('patientList').appendChild(card);
  }

  document.getElementById('addPatientBtn').addEventListener('click', () => {
    if (!editable) return;
    addPatient();
  });

  document.getElementById('startOccInput').addEventListener('input', (e) => {
    const num = parseFloat(e.target.value);
    wardDoc.startOcc = isNaN(num) ? 0 : num;
    recomputeCensus();
  });

  document.getElementById('nightUpdateBtn').addEventListener('click', () => {
    if (!editable) return;
    const wrap = document.getElementById('nightUpdateWrap');
    const opening = wrap.style.display === 'none';
    wrap.style.display = opening ? 'block' : 'none';
    if (!opening) return;
    document.getElementById('nightUpdateInput').focus();
    // The night nurse tapping this button is who's adding the update —
    // autofill the Pm shift's "Nurses on Duty" with her name if it's blank.
    const pmRefs = shiftInputs.pm;
    if (pmRefs && !wardDoc.shifts.pm.nurseOnDuty && currentProfile && currentProfile.name) {
      pmRefs.duty.value = currentProfile.name;
      pmRefs.duty.dispatchEvent(new Event('input'));
    }
  });

  document.getElementById('nightUpdateInput').addEventListener('input', (e) => {
    wardDoc.nightUpdate = e.target.value;
    updateSubmitVisibility();
  });

  function updateSubmitVisibility() {
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.style.display = editable ? '' : 'none';
  }

  function applyEditableState() {
    if (bedsInput) bedsInput.disabled = !editable;
    document.getElementById('startOccInput').disabled = !editable;
    document.getElementById('addPatientBtn').style.display = editable ? '' : 'none';
    document.getElementById('saveBtn').style.display = editable ? '' : 'none';
    document.getElementById('nightUpdateBtn').disabled = !editable;
    document.getElementById('nightUpdateBtn').style.display = editable ? '' : 'none';
    document.getElementById('nightUpdateInput').disabled = !editable;
    updateSubmitVisibility();
    Object.values(shiftInputs).forEach(refs => {
      Object.values(refs.fields).forEach(i => i.disabled = !editable);
      refs.duty.disabled = !editable;
    });
    document.querySelectorAll('.patient-card input, .patient-card textarea, .patient-card select, .patient-card .remove-btn')
      .forEach(el => el.disabled = !editable);
  }

  function refreshStatusPill() {
    const pill = document.getElementById('statusPill');
    const notice = document.getElementById('lockedNotice');
    pill.style.display = 'inline-block';
    if (wardDoc.locked) {
      pill.className = 'status-pill locked';
      pill.textContent = 'Locked';
    } else if (wardDoc.submitted) {
      pill.className = 'status-pill submitted';
      pill.textContent = 'Submitted';
    } else {
      pill.className = 'status-pill draft';
      pill.textContent = 'Draft';
    }

    const isAdmin = currentProfile && currentProfile.role === 'admin';
    editable = (isAdmin && adminEditOverride) || !wardDoc.locked;
    if (wardDoc.locked && !editable) {
      notice.style.display = 'block';
      notice.innerHTML = '';
      const text = document.createElement('span');
      text.textContent = isAdmin
        ? "This ward's report is locked."
        : "This ward's report is locked. Ask the Overall Nurse to grant access before editing.";
      notice.appendChild(text);
      if (isAdmin) {
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'admin-edit-btn';
        editBtn.textContent = '✏️';
        editBtn.title = 'Switch to edit mode';
        editBtn.addEventListener('click', () => {
          adminEditOverride = true;
          refreshStatusPill();
          renderPatients();
        });
        notice.appendChild(editBtn);
      }
    } else {
      notice.style.display = 'none';
    }
    applyEditableState();
  }

  function prevDateId(id) {
    const [y, m, d] = id.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d - 1));
    return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0') + '-' + String(dt.getUTCDate()).padStart(2, '0');
  }

  async function loadWard(wardKey) {
    currentWardKey = wardKey;
    adminEditOverride = false; // default to read-only even for admin; they can tap ✏️ per ward
    const w = WARDS.find(x => x.key === wardKey);
    const ref = doc(db, 'nurseReports', dateId, 'wards', wardKey);
    let snap;
    try {
      snap = await getDoc(ref);
    } catch (e) {
      setTopStatus("Couldn't load this ward's report: " + (e.code || e.message || 'unknown error'), true);
      return;
    }
    wardDoc = snap.exists() ? Object.assign(defaultWardDoc(w), snap.data()) : defaultWardDoc(w);
    // Normalize shape in case of partial legacy data
    wardDoc.shifts = wardDoc.shifts || {};
    SHIFTS.forEach(s => { wardDoc.shifts[s.key] = Object.assign(blankShift(), wardDoc.shifts[s.key] || {}); });
    wardDoc.patients = Array.isArray(wardDoc.patients) ? wardDoc.patients : [];
    wardDoc.patients.forEach(p => {
      if (!p.id) p.id = 'p' + Math.random().toString(36).slice(2);
      if (typeof p.status !== 'string') p.status = '';
    });
    wardDoc.nightUpdate = typeof wardDoc.nightUpdate === 'string' ? wardDoc.nightUpdate : '';
    wardDoc.nightUpdateBy = wardDoc.nightUpdateBy || '';

    if (!snap.exists()) {
      // Best-effort carry-over: yesterday's closing Occ becomes today's
      // starting census. Never overrides an already-saved draft's figure.
      try {
        const prevRef = doc(db, 'nurseReports', prevDateId(dateId), 'wards', wardKey);
        const prevSnap = await getDoc(prevRef);
        if (prevSnap.exists() && typeof prevSnap.data().occ === 'number') {
          wardDoc.startOcc = prevSnap.data().occ;
        }
      } catch (e) { /* non-fatal — leave startOcc at 0, nurse can correct it */ }
    }

    document.getElementById('startOccInput').value = typeof wardDoc.startOcc === 'number' ? wardDoc.startOcc : 0;
    buildShiftTable();
    refreshStatusPill();
    fillShiftInputsFromDoc();
    renderPatients();

    document.getElementById('nightUpdateInput').value = wardDoc.nightUpdate;
    document.getElementById('nightUpdateWrap').style.display = wardDoc.nightUpdate ? 'block' : 'none';
    document.getElementById('nightUpdateMeta').textContent = wardDoc.nightUpdateBy ? ('Added by ' + wardDoc.nightUpdateBy) : '';
    updateSubmitVisibility();

    document.getElementById('formBox').style.display = 'block';
    setTopStatus('');
  }

  wardSelect.addEventListener('change', () => {
    document.getElementById('formBox').style.display = 'none';
    const archiveBtn = document.getElementById('wardArchiveBtn');
    if (wardSelect.value) {
      loadWard(wardSelect.value);
      const w = WARDS.find(x => x.key === wardSelect.value);
      archiveBtn.style.display = '';
      archiveBtn.onclick = () => {
        window.location.href = 'archive-list.html?type=ward&ward=' + encodeURIComponent(w.key) + '&label=' + encodeURIComponent(w.label);
      };
    } else {
      archiveBtn.style.display = 'none';
    }
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (!currentWardKey || !wardDoc || !editable) return;
    recomputeTotals();
    // The nurse pressing Save is the one who wrote the report — autofill the
    // Am shift's "Nurses on Duty" with her name if it's still blank.
    const amRefs = shiftInputs.am;
    if (amRefs && !wardDoc.shifts.am.nurseOnDuty && currentProfile && currentProfile.name) {
      amRefs.duty.value = currentProfile.name;
      amRefs.duty.dispatchEvent(new Event('input'));
    }
    const ref = doc(db, 'nurseReports', dateId, 'wards', currentWardKey);
    const payload = Object.assign({}, wardDoc, {
      updatedAt: serverTimestamp(),
      updatedBy: currentProfile.name || 'Unknown'
    });
    try {
      await setDoc(ref, payload, { merge: true });
      setSaveStatus('Saved.', false);
    } catch (e) {
      setSaveStatus("Couldn't save: " + (e.code || e.message || 'unknown error'), true);
    }
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    if (!currentWardKey || !wardDoc || !editable) return;
    recomputeTotals();
    const hasNightUpdate = !!(wardDoc.nightUpdate && wardDoc.nightUpdate.trim());
    // The nurse submitting is the one who added the night update — autofill
    // the Pm shift's "Nurses on Duty" with her name if it's still blank.
    // Only relevant when there actually is a night update to attribute.
    const pmRefs = shiftInputs.pm;
    if (hasNightUpdate && pmRefs && !wardDoc.shifts.pm.nurseOnDuty && currentProfile && currentProfile.name) {
      pmRefs.duty.value = currentProfile.name;
      pmRefs.duty.dispatchEvent(new Event('input'));
    }
    const ref = doc(db, 'nurseReports', dateId, 'wards', currentWardKey);
    const payload = Object.assign({}, wardDoc, {
      submitted: true,
      locked: true,
      submittedBy: currentProfile.name || 'Unknown',
      submittedAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      updatedBy: currentProfile.name || 'Unknown'
    });
    if (hasNightUpdate) {
      payload.nightUpdateBy = wardDoc.nightUpdateBy || currentProfile.name || 'Unknown';
      payload.nightUpdatedAt = wardDoc.nightUpdatedAt || serverTimestamp();
    }
    try {
      await setDoc(ref, payload, { merge: true });
      setSaveStatus('Report submitted.', false);
      wardDoc.submitted = true;
      wardDoc.locked = true;
      if (hasNightUpdate) {
        wardDoc.nightUpdateBy = payload.nightUpdateBy;
        document.getElementById('nightUpdateMeta').textContent = 'Added by ' + wardDoc.nightUpdateBy;
      }
      refreshStatusPill();
      renderPatients();
    } catch (e) {
      setSaveStatus("Couldn't submit: " + (e.code || e.message || 'unknown error'), true);
    }
  });

  requireAuth((user, profile) => {
    currentUser = user;
    currentProfile = profile;
  });
</script>
</body>
</html>
