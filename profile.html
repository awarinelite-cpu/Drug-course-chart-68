<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>My Profile · Ward Charts</title>
<link rel="stylesheet" href="js/styles.css">
<style>
  .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold;
    flex-shrink: 0; overflow: hidden;
  }
  .role-badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px;
    font-weight: bold; text-transform: uppercase; background: #eff6ff; color: #1d4ed8; margin-top: 4px;
  }
  .readonly-field { padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb; font-size: 14px; color: #374151; }
  hr.section-sep { border: none; border-top: 1px solid #e5e7eb; margin: 20px 0; }
  #pushToggleBtn.push-on { background: #16a34a; border-color: #16a34a; }
  #pushToggleBtn.push-off { background: #dc2626; border-color: #dc2626; }
</style>
</head>
<body>
<script type="module" src="js/nav.js"></script>
<div class="topbar">
  <div class="brand">My Profile</div>
  <div class="right">
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="gnavGoBack('index.html')">Back</button>
    <button class="btn btn-secondary" style="padding:6px 12px;" onclick="logout()">Log Out</button>
  </div>
</div>

<div class="container">
  <div class="card-box">
    <div class="profile-header">
      <div class="avatar" id="pf_avatar">?</div>
      <div>
        <div style="font-size:18px; font-weight:bold;" id="pf_headerName">Loading…</div>
        <span class="role-badge" id="pf_headerRole"></span>
      </div>
    </div>

    <hr class="section-sep">

    <div class="field"><label>Full Name</label><input type="text" id="pf_name"></div>
    <div class="field"><label>Phone Number</label><input type="text" id="pf_phone" placeholder="e.g. 080XXXXXXXX"></div>
    <div class="field"><label>Department / Ward</label><input type="text" id="pf_department" placeholder="e.g. Officers Ward"></div>
    <div class="field">
      <label>Gender</label>
      <select id="pf_gender" onchange="renderAvatar()">
        <option value="">Select gender…</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="field">
      <label>Email</label>
      <div class="readonly-field" id="pf_email"></div>
    </div>
    <div class="field">
      <label>Role</label>
      <div class="readonly-field" id="pf_role"></div>
    </div>

    <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
    <div id="pfMsg" style="margin-top:10px;"></div>
  </div>

  <div class="card-box">
    <h3 style="margin-top:0;">Dose Due Alerts</h3>
    <p style="font-size:13px; color:#555; margin-top:0;">
      Get a notification on this phone when a patient's next drug dose is due,
      even if the app isn't open — covers every patient on the ward, not just
      whoever you last had open.
    </p>
    <button class="btn btn-primary" id="pushToggleBtn" onclick="togglePush()">Loading…</button>
    <div id="pushMsg" style="margin-top:10px;"></div>
    <div style="margin-top:10px; font-size:11px; color:#9ca3af;">build: push-diag-2</div>
  </div>

  <div class="card-box">
    <h3 style="margin-top:0;">Change Password</h3>
    <div class="field"><label>Current Password</label><input type="password" id="pf_curpw"></div>
    <div class="field"><label>New Password</label><input type="password" id="pf_newpw" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="pf_newpw2"></div>
    <button class="btn btn-purple" onclick="changePassword()">Update Password</button>
    <div id="pwMsg" style="margin-top:10px;"></div>
  </div>
</div>

<script type="module">
  import { requireAuth, logout } from "./js/auth-guard.js";
  import { auth, db } from "./js/firebase.js";
  import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { avatarMarkup } from "./js/avatar.js";
  import { pushIsEnabled, enablePushForThisDevice, disablePushForThisDevice } from "./js/push.js";

  window.logout = logout;
  let currentUser = null;
  let currentProfile = null;

  requireAuth((user, profile) => {
    currentUser = user;
    currentProfile = profile;
    renderProfile();
    renderPushButton();
  });

  function renderPushButton() {
    const btn = document.getElementById('pushToggleBtn');
    btn.classList.remove('push-on', 'push-off');
    if (!('Notification' in window)) {
      btn.textContent = 'Not supported on this browser';
      btn.disabled = true;
      return;
    }
    if (Notification.permission === 'denied') {
      btn.textContent = 'Blocked — enable in browser settings';
      btn.disabled = true;
      btn.classList.add('push-off');
      return;
    }
    btn.disabled = false;
    const on = pushIsEnabled();
    btn.textContent = on ? 'Alerts On — Tap to Turn Off' : 'Turn On Dose Alerts';
    btn.classList.add(on ? 'push-on' : 'push-off');
  }

  window.togglePush = async function () {
    const btn = document.getElementById('pushToggleBtn');
    const msg = document.getElementById('pushMsg');
    msg.innerHTML = '<div class="info-msg">Working…</div>';
    btn.disabled = true;

    // Registering a push token means waiting on browser permission, the
    // service worker, and a network round-trip to Google's push servers —
    // any of which can hang on a slow/restricted connection with no error at
    // all. Without a timeout, the button would then stay disabled forever
    // with zero feedback. Race it instead so the nurse always gets a message.
    function withTimeout(promise, ms) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error('Timed out — check your internet connection and try again.')), ms);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    try {
      if (pushIsEnabled()) {
        msg.innerHTML = '<div class="info-msg">Turning off…</div>';
        await withTimeout(disablePushForThisDevice(currentUser.uid), 60000);
        msg.innerHTML = '<div class="info-msg">Dose alerts are now off for this phone.</div>';
      } else {
        await withTimeout(
          enablePushForThisDevice(currentUser.uid, (label) => {
            msg.innerHTML = '<div class="info-msg">' + label + '</div>';
          }),
          60000
        );
        msg.innerHTML = '<div class="info-msg">Dose alerts are on for this phone.</div>';
      }
    } catch (e) {
      msg.innerHTML = '<div class="error-msg">' + (e.message || 'Could not update alert settings.') + '</div>';
    }
    renderPushButton();
  };

  function renderProfile() {
    const p = currentProfile;
    document.getElementById('pf_headerName').textContent = p.name || 'Unnamed';
    document.getElementById('pf_headerRole').textContent = p.role || '';
    document.getElementById('pf_name').value = p.name || '';
    document.getElementById('pf_phone').value = p.phone || '';
    document.getElementById('pf_department').value = p.department || '';
    document.getElementById('pf_gender').value = p.gender || '';
    document.getElementById('pf_email').textContent = p.email || currentUser.email || '';
    document.getElementById('pf_role').textContent = p.role || '';
    renderAvatar();
  }

  // The avatar auto-fills based on gender (male/female icon); falls back to
  // the nurse's initials if gender hasn't been set yet.
  window.renderAvatar = function () {
    const gender = document.getElementById('pf_gender').value;
    const name = document.getElementById('pf_name').value || currentProfile.name;
    document.getElementById('pf_avatar').innerHTML = avatarMarkup({ name, gender }, 56);
  };

  window.saveProfile = async function () {
    const msg = document.getElementById('pfMsg');
    msg.innerHTML = '';
    const name = document.getElementById('pf_name').value.trim();
    if (!name) {
      msg.innerHTML = '<div class="error-msg">Name cannot be empty.</div>';
      return;
    }
    const updates = {
      name,
      phone: document.getElementById('pf_phone').value.trim(),
      department: document.getElementById('pf_department').value.trim(),
      gender: document.getElementById('pf_gender').value
    };
    try {
      await updateDoc(doc(db, 'users', currentUser.uid), updates);
    } catch (e) {
      msg.innerHTML = '<div class="error-msg">Save failed: ' + (e.code || e.message || 'unknown error') + '</div>';
      return;
    }
    currentProfile = { ...currentProfile, ...updates };
    renderProfile();
    msg.innerHTML = '<div class="info-msg">Profile updated.</div>';
  };

  window.changePassword = async function () {
    const msg = document.getElementById('pwMsg');
    msg.innerHTML = '';
    const curpw = document.getElementById('pf_curpw').value;
    const newpw = document.getElementById('pf_newpw').value;
    const newpw2 = document.getElementById('pf_newpw2').value;

    if (!curpw || newpw.length < 6) {
      msg.innerHTML = '<div class="error-msg">Enter your current password and a new one with at least 6 characters.</div>';
      return;
    }
    if (newpw !== newpw2) {
      msg.innerHTML = '<div class="error-msg">New passwords do not match.</div>';
      return;
    }
    try {
      const cred = EmailAuthProvider.credential(currentUser.email, curpw);
      await reauthenticateWithCredential(currentUser, cred);
      await updatePassword(currentUser, newpw);
    } catch (e) {
      msg.innerHTML = '<div class="error-msg">' + (e.code === 'auth/wrong-password' ? 'Current password is incorrect.' : (e.message || 'Failed to update password.')) + '</div>';
      return;
    }
    document.getElementById('pf_curpw').value = '';
    document.getElementById('pf_newpw').value = '';
    document.getElementById('pf_newpw2').value = '';
    msg.innerHTML = '<div class="info-msg">Password updated.</div>';
  };
</script>
</body>
</html>
